
interface_defs:
  apb :
    timing: elastic
    backpressure: { default: true, overridable: false }
    addressBus : true
    uvmAgent: true
    parameters :
      addr_t : { datatype : struct }
      data_t : { datatype : struct }
    signals: 
      paddr : addr_t
      psel : bool
      penable : bool
      pwrite : bool
      pwdata : data_t
      pready : bool
      prdata : data_t
      pslverr : bool
    modports :
      src : 
        inputs : ['pready', 'prdata', 'pslverr']
        outputs: ['paddr', 'psel', 'penable', 'pwrite', 'pwdata']
      dst : 
        inputs : ['paddr', 'psel', 'penable', 'pwrite', 'pwdata']
        outputs: ['pready', 'prdata', 'pslverr']
    sc_channel :
      type : 'apb'
      multicycle_types : []
    socket:
      src: { kind: drive, observe: true, lockstep: true }


types:
  _extRegWriteT:
    width: 2
    desc: "External register write strobe, any set bit requests a write"

interface_defs:
  external_reg : 
    parameters : 
      data_t : { datatype : struct }
    signals: 
      wdata : data_t
      rdata : data_t
      write : _extRegWriteT
    modports :
      src : 
        inputs : ['rdata']
        outputs: ['wdata', 'write']
      dst : 
        inputs : ['wdata', 'write']
        outputs: ['rdata']
    sc_channel :
      type : 'external_reg'
      multicycle_types : []
      set_initial_value: true
    mappedFrom : ['reg_ext']


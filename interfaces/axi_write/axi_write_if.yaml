
interface_defs:
  axi_write : 
    parameters : 
      addr_t : { datatype : struct }
      data_t : { datatype : struct }
      strb_t : { datatype : struct }
      # AXI4 USER sidebands, one per payload channel. Optional: an interface that
      # binds none is spelled exactly as it was before these existed, and each
      # user signal degrades to the one-bit placeholder the interface declares.
      awuser_t : { datatype : struct, optional : true }
      wuser_t : { datatype : struct, optional : true }
      buser_t : { datatype : struct, optional : true }
      # AXI4 transaction ID, shared by the address, data and response channels.
      # Optional: an interface that binds none carries the companion
      # templates' default, _axiIdT storage at the 4-bit width this
      # parameter declares.
      id_t : { datatype : type, optional : true, defaultWidth : 4 }
    signals:
      awaddr : addr_t
      awid : id_t
      awlen : 'bit [7:0]'
      awsize : 'bit [2:0]'
      awburst : 'bit [1:0]'
      awuser : awuser_t
      awvalid : bool
      awready : bool
      wdata : data_t
      wid : id_t
      wstrb : strb_t
      wlast : bool
      wuser : wuser_t
      wvalid : bool
      wready : bool
      bresp : 'bit [1:0]'
      bid : id_t
      buser : buser_t
      bvalid : bool
      bready : bool
    modports :
      src : 
        inputs : ['awready', 'wready', 'bresp', 'bid', 'buser', 'bvalid']
        outputs: ['awid', 'awaddr', 'awlen', 'awsize', 'awburst', 'awuser', 'awvalid', 'wid', 'wdata', 'wstrb', 'wlast', 'wuser', 'wvalid', 'bready']
      dst : 
        inputs : ['awid', 'awaddr', 'awlen', 'awsize', 'awburst', 'awuser', 'awvalid', 'wid', 'wdata', 'wstrb', 'wlast', 'wuser', 'wvalid', 'bready']
        outputs: ['awready', 'wready', 'bresp', 'bid', 'buser', 'bvalid']
    sc_channel :
      type : 'axi_write'
      multicycle_types : ['fixed_size', 'api_list_tracker', 'api_list_size']
    socket:
      src: { kind: drive, observe: true, lockstep: true }
      dst: { kind: drive, observe: true, lockstep: true }


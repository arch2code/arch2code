
interface_defs:
  notify_ack : 
    timing: elastic
    backpressure: { default: true, overridable: false }
    uvmAgent: true
    parameters : {}
    signals: 
      notify : bool
      ack : bool
    modports :
      src : 
        inputs : ['ack']
        outputs: ['notify']
      dst : 
        inputs : ['notify']
        outputs: ['ack']
    sc_channel :
      type : 'notify_ack'
      multicycle_types : []
    socket:
      src: { kind: drive }
      dst: { kind: drive }


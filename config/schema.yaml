# Example schema file

# schema entries start with the object/table name (eg constants)
# indented from the object name are fields that are used to capture the data
# fields can have either a single attribute or a nested set of attributes
# all tables have field named _context which is the relative filename that the entry is defined.
#
# schema format:
# object:
#   field: Field Type   //simple entry
#   field:              //entry with validator. Value of this field must be present in <objectName>,<object-field>
#     _type: Field Type
#     _validate:
#       section: <objectName>
#       field: <object-field>
#   field:              //entry with validator. Value of this field must be in the list of options
#     _type: Field Type
#       values:  # list of valid values
#         - <validValue1>
#         - <validValue2>
#   subObject:
#     _attribs: [multiple, optional, required, list]
#     field: outerKey   //should match key of outer table

#
# if the indented attributes do not contain a _type definition
# they are considered to contain fields and therefore is the definition of a sub table
#   sub table can have _attribs. These define rules for the subtable itself similar to fields
#   multiple: means these may be many entries per outer key
#   list: means that multiple entries in list form
#   collapsed: means that the subtable is the only thing except the key so the next level down are all part of the subtable
#              this avoids the need to specify the field all the subtable items are grouped under so evey input entry doesnt need the subtable field
#              eg see structures:
#              without collapse every input entry would look like
#              structName:
#                vars:   <- with collapse this vars: field is omitted
#                   myVar: {}
#
#
# _type is used to contain the field type that would otherwise be on the single line
# _validate is used to define a lookup in another object
#   the section defines which object to search in
#   field indicates which field to use. Note that this search is context aware, you can only have refences within defined scope
# _dataSchema allows for seperate definition of data capture and data storage. This is only applicable with custom hander
# _key is used to indicate when the key is actually made up of multiple fields
#   when this happens the fields are taken in order and assembled into a key
#   the goal of the key is to be a unique identifier
# _singular is used when the nested item is a simple value rather than a dict of values

# Field types
#  As stated above this can be either only attribute of the field or specified in indended _type
#
# key: used to define the field that the base name of the object goes in. Required field
#  the field identified as key will appear in output table in two forms.
#    field - just the value
#    fieldKey - the same value plus the file context aded to ensure uniqueness. For database purposes fieldKey should be used for any joins etc
# required: Required field (unless a field is specified as optional it is always required)
# eval: means that expression may require eval. Required field.
# const: can be a value or a key from constants. Required field.
# optional(default value): means that field is not required, (default value)
# optionalConst(default value): means that field is not required, (default value), and can also be a key from constants
# auto(xxx): field calculated by code, based on other fields. The function is defined _auto_xxx. eg auto(instanceGroup) will use _auto_instanceGroup fn
# outerkey: Specific to subtables, outer key to allow inner table to link to outer record note that similar to key this appeays in two forms
#  field - just the value of the outer key
#  fieldKey - the same value plus the file context aded to ensure uniqueness. For database purposes fieldKey should be used for any joins etc

# regular format consists of

constants:
  _attribs: [flat]
  constant: key
  evalCanonical: optional() # must be before value
  value: eval
  desc: required
  maxValue: optional(0)
  isParameterizable: optional(false)
  valueType:
    _type: optional(uint)
    _validate:
      values:
        - uint
        - int
        - real

variables:
  variable: key
  desc: required
  type:
    _type: required
    _validate:
      section: types
      field: type

types:
  _attribs: [flat, post(validateTypeWidth)]
  type: key
  desc: required
  isSigned: optional(false)
  maxBitwidth: optional(0)
  isParameterizable: optional(false)
  enum:
    _attribs: [optional, list, post(add_enum)] # post allows performing custom handling after entry is processed
    enumName: key
    desc: optional
    value: eval
  width: optionalConst()
  widthLog2: optionalConst()
  widthLog2minus1: optionalConst()

enums:
  _mapto: types # this section maps to the types section to allow user to define two types sections as yaml does not allow multiple sections with same name

structures: # customer handler, the fields here must match the code
  _attribs: [flat]
  structure: key
  vars:
    _attribs: [required, multiple, collapsed, flat]
    variable: key
    varType:
      _type: optional
      _validate:
        section: types
        field: type
    subStruct:
      _type: optional
      _validate:
        section: structures
        field: structure
    arraySize: optionalConst(0)
    desc: optional
    entryType: auto(entryType)
    generator: optional
    align: optional(0)
  isParameterizable: auto(structIsParameterizable)
  width: auto(structWidth) #note that because of collapsed this is not entered by user, and purely autogenerated
  maxBitwidth: auto(structMaxBitwidth)

interface_defs:
  _attribs: [flat]
  interface_type: key
  # marks an interface_def as a register-bus / address-bus meta-protocol
  addressBus: optional(false)
  parameters:
    _attribs: [optional, multiple]
    param: key
    datatype:
      _type: required
      _validate:
        values:
          - struct
          - type
          - typeStruct
    # when true the parameter need not be bound by a declaring interface;
    # unbound optional parameters are not required by validate_interface_structures
    optional: optional(false)
    # width of the signals this parameter types when a declaring interface leaves
    # the parameter unbound; the companion SV interface and C++ templates default
    # to a type of this width
    defaultWidth: optional(1)
  hdlparams:
    _attribs: [optional, multiple]
    hdlparam: key
    datatype: required
    isEval: optional(false)
    value: required
  signals:
    _attribs: [required, multiple]
    signal: key
    signalType: required
    _singular: signalType
  modports:
    _attribs: [required, multiple]
    modport: key
    modportGroups:
      _attribs: [optional, multiple, collapsed]
      modportGroup: key
      groups:
        _attribs: [singleEntryList, multiple, collapsed]
        signal: listkey
  sc_channel:
    _attribs: [dataGroup]
    type: required
    param_cast: optional
    thunker: optional(false)
    set_initial_value: optional(false)
    multicycle_types:
      _attribs: [optional, singleEntryList, multiple]
      multicycle_type: listkey
  # Hand-written *_port_socket.h / port_observe overloads, keyed by modport
  # direction. Omitted direction = no socket-shell thread for that end.
  socket:
    _attribs: [optional, multiple]
    direction: key
    kind:
      _type: required
      _validate:
        values:
          - drive
          - observe
    observe: optional(false)
    lockstep: optional(false)
  multiDst: optional(False)  # allow multiple destinations to connect to a single source
  mappedFrom:
    _attribs: [optional, singleEntryList, multiple]
    mapped_type: listkey  

interfaces:
  _attribs: [flat, post(validate_interface_structures)]
  interface: key
  interfaceType:
    _type: required
    _validate:
      section: interface_defs
      field: interface_type
  desc: required
  maxTransferSize: optionalConst(0) # for multiCycle operation, specifies the maximum transfer size in bytes.
                                    # For a single transaction, num_cycles = roundup( datapath width / transfer size ), where transfer size <= maxTransferSize
                                    # optional field for tracker based multiCycle interfaces. Note that this field maybe overridden in the connection section
  multiCycleMode:
    _type: optional()
    _validate:
      values:  # list of valid values
        - fixed_size        #
        - header_tracker    # for rdyVldBurst tracker tag comes from field in the header (based on field with "generator: tracker(xxx)"" in structures where xxx is the tracker name)
        - header_size       # for rdyVldBurst size comes from field in the header (based on field with "generator: tracker(length)"" in structures)
        - api_list_tracker  # tracker tag comes from write api and push_context
        - api_list_size     # size comes from write api and push_context
  trackerType: optional() # must specify a valid tracker name in the design. For cases where the tracker value is coming from the header, this field is optional
  structures: #indented list for subtable
    _attribs: [optional, list] #list means potentially more than 1
    structureType: key  # validated by the auto below against interface_defs parameters
    interfaceType: outer
    parameterDatatype: auto(interfaceParameterDatatype)
    structure: typeStruct(field, parameterDatatype) # names a types row or a structures row, whichever structureType's own datatype allows; see typeStruct in SCHEMA_SPECIFICATION.md
  isParameterizable: auto(intfIsParameterizable)

instances:
  _attribs: [flat]
  instance: key
  instanceType:
    _type: required
    _validate:
      section: blocks
      field: block
  variant: optional
  # type this contained instance with the CONTAINER block's active Config
  # template symbol instead of a variant selector; mutually exclusive with
  # variant. Preconditions are validated in calcBlockConfigInfo
  # (validate_inherit_container_params).
  inheritContainerParam: optional(false)
  color: optional
  count: optional(1)
  container:
    _type: auto(container)
    _validate:
      section: blocks
      field: block
      scope: global  # override the normal context search space to global
  offset: optional(0)  #overridden by address generation - **must be before addressGroup field**
  addressGroup: auto(addressGroup) #this field needs to be one of the valid AddressGroups defined in the addressControl file
  addressMultiples: auto(addressMultiples) #optional field to get multiple address groups
  addressID: auto(addressID) #note that even if specified in instances section, will be overridden
  instGroup: auto(instanceGroup) # this field needs to be one of the valid AddressGroups defined in the addressControl file
  instID: auto(instanceID)  #note that even if specified in instances section, will be overridden
  # The instance's own clock/reset binding map: key = a block clock/reset of
  # instanceType, value = a container clock/reset name, a new local net name
  # (an output binding only), or `~` to leave an output unconnected. The set
  # of valid values (local nets included) only exists after binding
  # resolution runs, so both the key and the value are validated in
  # clockTree.build()/projectCreate, not by a schema foreign key.
  clocks:
    _attribs: [optional, multiple]
    _singular: bind
    clock: key
    bind: optional
  resets:
    _attribs: [optional, multiple]
    _singular: bind
    reset: key
    bind: optional

blocks:
  _attribs: [flat, post(validateBlockAddressDecl)]
  block: key
  desc: required
  attrib: optional
  blockID: auto(instanceID)  #note that even if specified in instances section, will be overridden
  hasVl: optional(false)
  hasTb: optional(false)
  hasMdl: optional(true)
  hasRtl: optional(true)
  hasSkt: optional(false)
  isRegHandler: optional(false) # this is used to indicate that this block handles registers
  mdlLeafNode: optional(false)
  dir: auto(blockDir)
  maxAddress: optional(0) # filled out by address generation
  isParameterizable: optional(false) # filled out by block config post-processing
  defaultConfig: optional("") # filled out by block config post-processing
  configContext: optional("") # canonical config context (where the block's Config struct is emitted); filled out by block config post-processing
  params:
    _attribs: [optional, list, flat, post(validateBlockParamBacking)]
    param: key
  # The clocks and resets the block's implementation uses, named for its own
  # module ports. The declaration is
  # complete: a block's clocks and resets are exactly these entries, for a
  # container as for a leaf, and nothing is inferred from its children,
  # connections or ports. A block declaring no clocks: has one clock, `clk`,
  # input; a block declaring no resets: and having a default clock has one
  # reset, `rst_n`, on it (materialised in clockTree.BlockDomains.build()).
  # Neither implicit row exists as a schema row, so a clock:/reset: reference
  # below (the blockClock/blockReset combo foreign keys) resolves only on a
  # block that declares its clocks:/resets:. On a block that declares none,
  # `clk` is its only clock, so the reference is redundant and any stated
  # name is rejected.
  # A single-name list ('clocks: [clkSlow]') is accepted as the mapping form
  # with every field defaulted; normalised before schema processing (see
  # processYaml.py::_normalizeClockResetShortForm).
  clocks:
    _attribs: [optional, multiple, post(resolveBlockClockPeriod)]
    clock: key
    desc: optional
    direction:
      _type: optional(input)
      _validate:
        values:
          - input
          - output
    default: optional(false)
    # No schema default: unset means undeclared, which the build must tell
    # apart from an authored value. An undeclared clock's simulated rate is
    # supplied by getBDClocksResets.
    period: optional
    timeUnit:
      _type: optional(ns)
      _validate:
        values:
          - ps
          - ns
          - us
  resets:
    _attribs: [optional, multiple]
    reset: key
    desc: optional
    direction:
      _type: optional(input)
      _validate:
        values:
          - input
          - output
    default: optional(false)
    # The block-local clock this reset belongs to; unstated means the
    # block default clock, resolved in clockTree.BlockDomains.build(). A
    # stated name must be one of the same block's own clocks: rows, which the
    # blockClock combo below checks against the sibling clocks sub-table
    # (block + clock, the same shape parameters.variants.params.blockParam
    # uses against blocksparams). An unstated source leaves the combo
    # unstated and unvalidated.
    clock: optional
    blockClock:
      _combo:
        block: required
        clock: required
      _validate:
        section: blocksclocks
        field: blockclock
    async: optional(false)
  # A block authoring an empty `resets: {}` or `resets: []` has no reset at
  # all, distinct from omitting resets: entirely (which takes the implicit
  # rst_n). That distinction is parse-time state
  # (processYaml.py::_normalizeClockResetShortForm), not a schema field: the
  # generic optional-subtable field processing does not keep it, since an
  # empty collection and an absent key are both falsy, but nothing past
  # parsing needs it as a row field either.
  ports:
    _attribs: [optional, multiple]
    port: key
    interface:
      _type: required
      _validate:
        section: interfaces
        field: interface
    direction:
      _type: required
      _validate:
        values:
          - src
          - dst
    # The block clock this port is timed by; block-local, unstated means the
    # block default clock. A stated name must be one of the same
    # block's own clocks: rows (the blockClock combo); the port-domain
    # derivation that reads it is a separate concern (getBDPortDomain).
    clock: optional
    blockClock:
      _combo:
        block: required
        clock: required
      _validate:
        section: blocksclocks
        field: blockclock
  # leaf-owned register-bus ingress ports; direction is implicitly dst,
  # and interface.interfaceType must resolve to an interface_defs entry
  # with addressBus: true
  registerPorts:
    _attribs: [optional, multiple, post(validateRegisterPortInterface)]
    port: key
    interface:
      _type: required
      _validate:
        section: interfaces
        field: interface
    # Block-local bus clock/reset, each one of the same block's own clocks:/
    # resets: rows when stated; unstated means the block default clock
    # and its selected reset.
    clock: optional
    blockClock:
      _combo:
        block: required
        clock: required
      _validate:
        section: blocksclocks
        field: blockclock
    reset: optional
    blockReset:
      _combo:
        block: required
        reset: required
      _validate:
        section: blocksresets
        field: blockreset
  # per-router address-group attributes; mutually exclusive with
  # registerPorts on the same block
  addressBlock:
    _attribs: [dataGroup, post(registerAddressBlock)]
    addressGroup: required
    addressIncrement: required
    maxAddressSpaces: required
    varType: required
    enumPrefix: required
    upstreamPort: optional(apbReg)
    registerDecoderPort: optional(apbReg)
    # The router's own bus clock/reset, each one of the same block's own
    # clocks:/resets: rows when stated; unstated means the block default
    # clock and its selected reset.
    clock: optional
    blockClock:
      _combo:
        block: required
        clock: required
      _validate:
        section: blocksclocks
        field: blockclock
    reset: optional
    blockReset:
      _combo:
        block: required
        reset: required
      _validate:
        section: blocksresets
        field: blockreset

# Variants are authored as a nested mapping: the variant label is stated once
# and its parameters are listed underneath it as `<param>: <value>`.
#     ip:
#         variant1:
#             IP_DATA_WIDTH: 70
#             IP_MEM_DEPTH: 8
# The nesting is declared here, so the parser walks it natively (Pattern 4,
# collapsed + anchor, one level deeper than modports -> modportGroups):
#   parameters -> variants (collapsed, anchor = variant)
#              -> params    (collapsed, anchor = param, scalar value via _singular)
# The machinery auto-adds the outer keys (block, variant), their qualified
# {field}Key fields, and the parent-key chain; only the genuine per-level deltas
# are declared. The leaf table is `parametersvariantsparams`.
parameters:
  block:
    _type: key
    _validate:
      section: blocks
      field: block
  variants:
    _attribs: [collapsed, multiple, post(validateVariantParameterCompleteness)]
    variant: key
    params:
      _attribs: [collapsed, multiple, post(validateVariantBindingSizing)]
      _singular: value       # `<param>: <scalar>` -> the scalar is the `value`
      param: anchor
      value: const
      blockParam:
        _type: required
        _combo:
          block: required
          param: required
        _validate:
          section: blocksparams
          field: blockparam
      # Declaring project of this binding row (the project owning the row's
      # context file). Distinguishes two assembler projects that declare the
      # same local (block, variant) so both survive as distinct Config identities
      # in one composed database. Declared before blockVariantParam so it is
      # populated when the combo key is built.
      projectName: auto(variantProjectName)
      blockVariantParam:
        _key:
          block: required
          variant: required
          param: required
          projectName: required

connections: # custom handler
  _attribs: [flat]
  _dataSchema: #dataschema is used when how the data is parsed is different to how db stores data
    interface:
      _type: required
      _validate:
        section: interfaces
        field: interface
    name: optional() # name can be used to override the interface name and if used the ports and channels will follow this name
    src:
      _type: required
      _validate:
        section: instances
        field: instance
    srcport: optional # port can be used to force the naming of the port to allow it to be different each end
    dst:
      _type: required
      _validate:
        section: instances
        field: instance
    dstport: optional # port can be used to force the naming of the port to allow it to be different each end
    interfaceName: optional  # force the interface instance name for HW case. This is to allows the array case to instead use names for the array instances
    maxTransferSize: optional(0) # for multiCycle operation, overrides the interface maxTransferSize definition
    tracker: # this indicates that an interface will see the first or last use of a tracker tag, and interface should manage the tracker instead of generate error
             # the use case is to allow automation of tracker when HW implimentation is performing allocation or deallocation
      _type: optional
      _validate:
        values:
          - alloc
          - dealloc
          - allocReq   # outbound interface only alloc
          - deallocReq # outbound interface only dealloc
          - allocAck   # inbound interface only alloc
          - deallocAck # inbound interface only dealloc
    # Clock domain of this wire: a container clock, not a project reference.
    # Unstated means each endpoint's own block default independently, not a
    # name both endpoints must share; validated against the container's nets
    # in projectCreate (clockTree.build()), not by a schema foreign key.
    clock: optional()
    connection:  # at the end to ensure calculated fieldfs populated
      _key:
        interface: required
        name: required
        src: required
        srcport: optional
        dst: required
        dstport: optional
    isParameterizable: auto(interfaceRefIsParameterizable)
  interface:
    _type: required
    _validate:
      section: interfaces
      field: interface
  name: optional()
  src:
    _type: required
    _validate:
      section: instances
      field: instance
  srcport: optional
  dst:
    _type: required
    _validate:
      section: instances
      field: instance
  dstport: optional
  connection:
    _key:
      interface: required
      name: required
      src: required
      srcport: optional
      dst: required
      dstport: optional
  interfaceName: optional  # force the interface instance name for HW case. This is to allows the array case to instead use names for the array instances
  channel: optional #filled programatically based on src portName
  maxTransferSize: optional(0) # for multiCycle operation, overrides the interface maxTransferSize definition
  tracker: optional
  clock: optional()       # storage side of the _dataSchema field above
  isParameterizable: auto(interfaceRefIsParameterizable)
  ends:
    _attribs: multiple
    direction: required
    instanceType: required       # note validators not required as they have already been validated by data schema or programatically
    instanceTypeKey: required    #
    instance: required           #
    instanceKey: required        #
    port: optional
    portName: optional  #filled programatically
    portId :
      _key:
        instanceType: required  # we want port to be unique within a block (metadata will use qualified version)
        portName: required  # name is generated from rules of port name
    #connCount: optional

connectionMaps:
  _attribs: [flat]
  interface:
    _type: required
    _validate:
      section: interfaces
      field: interface
  name: optional()
  port: optional
  direction:
    _type: required
    _validate:
      values:  # list of valid values
        - src
        - dst
  portName: auto(portName)
  block:
    _type: required
    _validate:
      section: blocks
      field: block
      scope: global  # override the normal context search space to global
  instance:
    _type: required
    _validate:
      section: instances
      field: instance
  instancePort: # currently no validator
    _type: optional
  instancePortName: auto(instancePortName)
  isParameterizable: auto(interfaceRefIsParameterizable)
  # A connectionMaps row's boundary port
  # takes the inner port's derived domain; it carries no clock: of its own.
  portId : # at end for ordering
    _key:
      block: required  # metadata will use qualified version (blockKey)
      portName: required

memories:
  _attribs: [flat]
  memory: required
  structure:
    _type: required
    _validate:
      section: structures
      field: structure
  block:
    _type: required
    _validate:
      section: blocks
      field: block
  desc: required
  wordLines: param
  addressStruct:
    _type: required
    _validate:
      section: structures
      field: structure
  count: optionalConst(1)
  offset: optional(0)
  decodeSize: optional(0)   # filled out by calcAddresses; bytes of memory-decoded address range (worst case)
  regAccess: optional(false)
  local: optional(false) # for memories that need to be in flops with fast array access
  isParameterizable: auto(memIsParameterizable)
  # The owning block's clock this memory is on, and the reset for the
  # register bridge's memory side; both block-local, each one of the owning block's
  # own clocks:/resets: rows when stated, else the block default clock and
  # its selected reset, resolved by clockTree.BlockDomains.build() once the
  # owning block's own defaultClock/selectedReset are known.
  clock: optional
  blockClock:
    _combo:
      block: required
      clock: required
    _validate:
      section: blocksclocks
      field: blockclock
  reset: optional
  blockReset:
    _combo:
      block: required
      reset: required
    _validate:
      section: blocksresets
      field: blockreset
  memoryBlock:
    _key:
      memory: required
      block: required
  memoryType:
    _type: optional(dualPort)
    _validate:
      values:
        - singlePort
        - dualPort
        - register
  ports:
    _attribs: [optional, singleEntryList, multiple]  # singleEntryList means that the user provides a single entry and all other fields are derived from this
    port: listkey # required field for singleEntryList
    memoryBlock: outerkey
    memoryBlockPort:
      _key:
        memoryBlock: outerkey
        port: required

registers:
  _attribs: [flat, post(registers)]
  register: required
  regType:
    _type: required
    _validate:
      values:  # list of valid values
        - ro
        - rw
        - ext
        - memory
  block:
    _type: required
    _validate:
      section: blocks
      field: block
  desc: required
  structure:
    _type: required
    _validate:
      section: structures
      field: structure
  addressStruct:
    _type: optional
    _validate:
      section: structures
      field: structure
  wordLines: optionalConst(0)
  offset: optional(0)
  decodeSize: optional(0)   # filled out by calcAddresses for memory-type registers; bytes of memory-decoded address range (worst case)
  defaultValue: optional(0)
  isParameterizable: auto(regIsParameterizable)
  maxBytes: auto(regMaxBytes)
  registerBlock:
    _key:
      register: required
      block: required

specialStructures:
  structure: key
  baseStruct:
    _type: required
    _validate:
      section: structures
      field: structure

memoryConnections:
  _attribs: [flat]
  memory: required
  block:
    _type: required
    _validate:
      section: blocks
      field: block
  memoryBlock:
    _type: required
    _combo:
      memory: required
      block: required
    _validate:
      section: memories
      field: memoryBlock
  port: required
  memoryBlockPort:
    _type: required
    _combo:
      memoryBlock: required
      port: required
    _validate:
      section: memoriesports
      field: memoryBlockPort
  instance:
    _type: optional()
    _validate:
      section: instances
      field: instance
  isParameterizable: auto(memoryConnectionIsParameterizable)
  # A memoryConnections row carries no clock: of its own; the accessing side
  # derives its own domain from its own block and instance, and must agree
  # with the memory's declared domain.
  memoryBlockInstance:
    _key:
      memory: required
      block: required
      instance: required


registerConnections:
  _attribs: [flat]
  register: required
  block:
    _type: required
    _validate:
      section: blocks
      field: block
  registerBlock:
    _type: required
    _combo:
      register: required
      block: required
    _validate:
      section: registers
      field: registerBlock
  instance:
    _type: required
    _validate:
      section: instances
      field: instance
  isParameterizable: auto(registerConnectionIsParameterizable)
  # A registerConnections row carries no clock: of its own; the register's
  # domain is that of the bus reaching its owning block's register port, and
  # the accessing side derives its own.
  registerBlockInstance:
    _key:
      register: required
      block: required
      instance: required

# encoders are custom object used to describe how different ranges of values are encoded into a single value
# all encoded items are power of 2 size, but can be different for different items
# logic will sort items in decending size order for efficent encoding
# to put encoded value at the end of a number range zeroBased should be set to false
# and subFieldBits should be set to the number of bits that are xor'd with the value.
# eg if a 32bit value has some encoded values at the end of the range, then the subFieldBits would be 32, and zeroBased would be false.
encoders:
  encoder: key
  desc: required
  zeroBased: optional(true)
  encoderType: required # type used to hold an encoded value. This type will be created in the types section
  encoderTypeDesc: required
  encoderTypeWidth: const
  totalBits: optional(0)   # filled out by custom handler. Total number of bits required for this encoder
  enumType: optional       # filled out by custom handler. defaults to encoder name keyTypeT if not provided. This is for the type (with enum) that differentiates between items
  enumPrefix: optional     # filled out by custom handler. Prefix to be used for enum values. defaults to encoder name KEY_TYPE_ if not provided
  enumDesc: optional
  baseConstPrefix: optional # filled out by custom handler. Prefix to be used for base constants ie the value for the zeroth element of a given item
  encodeMax: optional(0)   # filled out by custom handler. Maximum value output from the encoder
  extendedRangeItem: optional # should only be used in zeroBased: False case. Allows specification of values outside of encoded range
  extendedRangeDesc: optional # should only be used in zeroBased: False case. Allows description of values outside of encoded range
  items:
    _attribs: [required, multiple]
    item: key
    desc: required
    varName: required
    numBits: const
    itemOrder: optional(0) # filled out by custom handler, result of sorting by size
    encodingValue: optional(0) # filled out by custom handler, value detected by encoder

# projectScope: authored in the project file, not design YAML, and stored in a
# bucket keyed by the declaring projectName. Design YAML references these with
# _validate scope: project, which resolves in the referring row's own project.
clocks:
  _attribs: [flat, projectScope, post(resolveClockPeriod)]
  clock: key
  desc: required
  default: optional(false)
  period: optional(1)     # simulation attribute only, no synthesis meaning
  timeUnit:
    _type: optional(ns)
    _validate:
      values:
        - ps
        - ns
        - us

resets:
  _attribs: [flat, projectScope, post(resolveReset)]
  reset: key
  desc: required
  default: optional(false)
  clock:                  # domain this reset belongs to, the default clock if unstated
    _type: optional()
    _validate:
      section: clocks
      field: clock
      scope: project
  # Cycles of this reset's own clock the co-simulation wrapper holds it asserted.
  # Per reset, not per project: a reset in a 3 ns domain and one in a 1 ns domain
  # share no release requirement. The default of three exceeds the two cycles a
  # synchronous reset needs.
  releaseCycles: optional(3)

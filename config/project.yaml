# Base project file that defines project level information, inherited by every project
# note $a2c is automatically replaced with the path to the a2c directory
dbSchema: $a2c/config/schema.yaml

# Interface definitions loaded into the _a2csystem context of every project
systemFiles:
  - $a2c/interfaces/apb/apb_if.yaml
  - $a2c/interfaces/status/status_if.yaml
  - $a2c/interfaces/rdy_vld/rdy_vld_if.yaml
  - $a2c/interfaces/req_ack/req_ack_if.yaml
  - $a2c/interfaces/push_ack/push_ack_if.yaml
  - $a2c/interfaces/pop_ack/pop_ack_if.yaml
  - $a2c/interfaces/external_reg/external_reg_if.yaml
  - $a2c/interfaces/memory/memory_if.yaml
  - $a2c/interfaces/notify_ack/notify_ack_if.yaml
  - $a2c/interfaces/axi_read/axi_read_if.yaml
  - $a2c/interfaces/axi_write/axi_write_if.yaml
  - $a2c/interfaces/axi4_stream/axi4_stream_if.yaml
  - $a2c/interfaces/raw/raw_if.yaml

templates:
  # SystemC/C++ templates
  classDecl: $a2c/templates/systemc/classDecl.py
  baseClassDecl: $a2c/templates/systemc/baseClassDecl.py
  constructor: $a2c/templates/systemc/constructor.py
  baseConstructor: $a2c/templates/systemc/baseConstructor.py
  blockRegs: $a2c/templates/systemc/blockRegs.py
  blockRegistrar: $a2c/templates/systemc/blockRegistrar.py
  vlRegistrar: $a2c/templates/systemc/vlRegistrar.py
  moduleScaffold: $a2c/templates/systemc/moduleScaffold.py
  moduleExport: $a2c/templates/systemc/moduleScaffold.py
  scaffold: $a2c/templates/fileGen/scaffold.py
  headers: $a2c/templates/systemc/headers.py
  includes: $a2c/templates/systemc/includes.py
  config: $a2c/templates/systemc/config.py
  structures: $a2c/templates/systemc/structures.py
  cpp_encoder: $a2c/templates/systemc/encoder.py
  module_hdl_sc_wrapper: $a2c/templates/systemc/module_hdl_wrapper.py
  tbExternal: $a2c/templates/systemc/testbench.py
  tbConfig: $a2c/templates/systemc/testbench.py
  testbench: $a2c/templates/systemc/testbench.py
  # SystemVerilog templates
  moduleInterfacesInstances: $a2c/templates/systemVerilog/moduleInterfacesInstances.py
  apbDecodeModule: $a2c/templates/systemVerilog/apbDecodeModule.py
  moduleRegs: $a2c/templates/systemVerilog/moduleRegs.py
  constantsTypesEnumsStructures: $a2c/templates/systemVerilog/constantsTypesEnumsStructures.py
  package: $a2c/templates/systemVerilog/package.py
  module_hdl_sv_wrapper: $a2c/templates/systemVerilog/module_hdl_wrapper.py
  encoder: $a2c/templates/systemVerilog/encoder.py
  rtlDotF: $a2c/templates/systemVerilog/rtldotf.py
  # Documentation templates
  blockHeader: $a2c/templates/doc/blockHeader.j2
  block: $a2c/templates/doc/block.j2
  connectionHeader: $a2c/templates/doc/connectionHeader.py
  structure: $a2c/templates/doc/structure.j2
  memories: $a2c/templates/doc/memories.py
  blockSpecification: $a2c/templates/doc/blockSpecification.py
  structDiagram: $a2c/templates/doc/structDiagram.py
  doctext: $a2c/templates/doc/doctext.py

dirs: # this is list of locations that can be referenced as base path in fileMap section
  #root: ../..                  # project root directory relative to project file - required to be supplied by
  base: $root/base             # for block base classes
  registrar: $root/registrar   # per-assembler block-registration trampolines + consumer-selected configs
  model: $root/model           # systemC model implementation
  rtl: $root/rtl               # RTL implementation
  vl_wrap: $root/verif/vl_wrap # rtl wrapper files
  tb: $root/tb                 # testbench definition files
  fwInc: $root/fw/include      # firmware include files

# Generated file placement. The directory structure mirrors the architecture yaml hierarchy.
fileGeneration:
  template: $a2c/templates/fileGen/fileGen.py
  # Layout axis ordering, selected per project file (a nested project uses its own):
  #   functional   - $root/<model|rtl|...>/<decomp>/file
  #   hierarchical - <node>/<model|rtl|...>/file
  layout: functional
  # Node-relative segment dirs for hierarchical layout; dirs: above is the
  # functional counterpart. Multi-level functional tails flatten (verif/vl_wrap
  # -> verif, fw/include -> fw). yaml/prj/rundir/include are project-scope
  # conventions, not fileMap segments; rundir and include stay $root-anchored.
  hierarchicalDirs:
    base: base
    registrar: registrar
    model: model
    rtl: rtl
    tb: tb
    vl_wrap: verif      # flattened (functional: $root/verif/vl_wrap)
    fwInc: fw           # flattened (functional: $root/fw/include)
    yaml: yaml
    prj: $root/prj
    rundir: $root/rundir
    include: $root/include  # build config stays at project root (user-owned, not under prj/)
  # Toolchain group per fileMap basePath segment. Placement is selected by
  # fileMap[*].basePath; this map only records participation in build discovery.
  buildGroups:
    base: sc
    registrar: sc
    model: sc
    tb: sc
    fwInc: sc
    rtl: sv
    vl_wrap: vl
  fileMap:
    # mode: the iteration domain - block (per design block), context (per yaml
    #   file, typically includes/packages), registrar (per assembler x
    #   instantiated child), project (exactly one per project).
    # name is appended to the module/context name to form the filename; ext maps
    #   logical extension keys to real ones. basePath must reference a dirs: key.
    # Placement otherwise follows the defining yaml file's directory unless the
    #   block definition overrides it; blockDir: true appends the block name.
    # cond: is OR - any listed field matching generates the file. condAnd: is AND -
    #   all listed fields must match. Neither means always generate.
    # smartInclude is yaml based rather than block based: if true the file is created
    #   only when the yaml file has content to include, if false it is always created.
    blockBase   : { name : "Base",            ext: {cppm: "cppm"},         cond: {hasMdl: true, hasTb: true},   mode: block,   basePath: base,    desc: "Module Base class interface unit (Base/Inverted/Channels)"}
    # Every block implementation is a single C++20 module interface unit whose
    # member bodies are module-visible. classDecl selects the form on hasOwnParams:
    # a block declaring its own params: becomes a template<typename Config> class,
    # any other block an untemplated `export SC_MODULE(...)`.
    blockModule : { name : "",                ext: {cppm: "cppm"},         cond: {hasMdl: true}, mode: block, basePath: model, desc: "Block module interface unit (.cppm, all blocks)"}
    # mode: registrar emits one <child>Registrar per distinct class-template child
    # an assembler instantiates, under the assembler's directory in the registrar
    # root. cond/condAnd apply to the instantiated child and key on hasOwnParams,
    # not isParameterizable: only a child declaring its own params: is a
    # template<typename Config> whose instantiation the trampoline must pick, so a
    # container flagged isParameterizable only because parameterizable structures
    # transit it self-registers and gains no trampoline. requiresRegistrations
    # drops the pair with nothing to register - a child whose bindings are all
    # typed by the parent's own Config is named at the parent's createInstance
    # site, leaving a TU holding only its preamble.
    blockRegistrar : { name : "Registrar",    ext: {cppm: "cppm"},         cond: {hasOwnParams: true},  condAnd: {hasMdl: true}, mode: registrar, basePath: registrar, requiresRegistrations: true, desc: "Per-assembler per-child trampoline registrar TU"}
    # The verilated counterpart of blockRegistrar: one <child>VlRegistrar.cpp per
    # distinct verilated (hasVl) child an assembler instantiates, in the assembler's
    # registrar domain. The whole TU is guarded by #ifdef VERILATOR and owns the
    # `_verif` factory registrations. Discovered as an ordinary registrar/ source
    # by A2C_SC_SRC_DIRS.
    blockVlRegistrar : { name : "VlRegistrar", ext: {src: "cpp"},           cond: {hasVl: true},              mode: registrar, basePath: registrar, desc: "Per-assembler per-child Verilated-wrapper registrar TU"}
    # One owner-qualified per-variant Config module interface unit per (declaring
    # project, reused child) in the assembler's registrar domain, aggregating the
    # assembler-declared (foreign) variants of that child. Emitted only when the
    # assembler's owning project declares a foreign variant; same-project/default
    # variants stay in the child's context config header. foreignConfig: true
    # owner-qualifies the basename; the cppm ext routes the unit into
    # A2C_CPP_MODULE_FILES, so consumers import `<project>.<child>.config` rather
    # than textually including a header.
    foreignConfig : { name : "VariantConfig", ext: {cppm: "cppm"},         cond: {isParameterizable: true},  condAnd: {hasMdl: true}, mode: registrar, basePath: registrar, foreignConfig: true, desc: "Owner-qualified foreign per-variant Config module interface unit"}
    rtlModule   : { name : "",                ext: {sv: "sv"},             cond: {hasRtl: true},                mode: block,   basePath: rtl,     desc: "RTL implementation file"}
    vlSvWrap    : { name : "_hdl_sv_wrapper", ext: {sv: "sv"},             cond: {hasVl: true},                 mode: block,   basePath: vl_wrap, variant: true, desc: "SystemVerilog HDL module wrapper for verilator"}
    # Canonical parameterized SV wrapper body: one include-only .svh per
    # parameterizable block, `include`d by each variant trampoline. Restricted to
    # parameterizable VL blocks so a plain block emits only its single .sv top,
    # with no .svh and no name collision.
    vlSvWrapBody: { name : "_hdl_sv_wrapper", ext: {svh: "svh"},           cond: {isParameterizable: true}, condAnd: {hasVl: true}, mode: block, basePath: vl_wrap, variant: false, desc: "Canonical parameterized SV wrapper body (include-only)"}
    vlScWrap    : { name : "_hdl_sc_wrapper", ext: {hdr: "h"},             cond: {hasVl: true},                 mode: block,   basePath: vl_wrap, desc: "SystemC Verilated HDL module derived class header file"}
    # PARENT-OWNED per-variant SV verilated wrapper top, one per (declaring project,
    # reused child, foreign variant), in the assembler's vl_wrap domain. Only the
    # declaring assembler project emits it (foreignConfig gate); same-project
    # variants keep the bare child-emitted vlSvWrap top. The trampoline `include`s
    # the child's canonical .svh body and binds the variant's resolved literals. The
    # owner-qualified top module name (<project>_<child>_<variant>_hdl_sv_wrapper)
    # keeps two projects' variants of the same reused child distinct Verilator tops.
    vlSvWrapForeign : { name : "_hdl_sv_wrapper", ext: {sv: "sv"},         cond: {isParameterizable: true},  condAnd: {hasVl: true}, mode: registrar, basePath: vl_wrap, variant: true, foreignConfig: true, desc: "Owner-qualified foreign per-variant SV verilated wrapper top"}
    # Exactly one testbench artifact and class family per block (no variant: true).
    # `--variant` is solely a generated-code parameter, consumed by templates to
    # select the DUT Config and factory variant string.
    testBench   : { name : "Testbench",       ext: {cppm: "cppm"},         cond: {hasTb: true}, blockDir: true, mode: block,   basePath: tb,    desc: "Testbench top module interface unit"}
    tbConfig    : { name : "Config",          ext: {src: "cpp"},           cond: {hasTb: true}, blockDir: true, mode: block,   basePath: tb,    desc: "Testbench config files"}
    tbExternal  : { name : "External",        ext: {cppm: "cppm"},         cond: {hasTb: true}, blockDir: true, mode: block,   basePath: tb,    desc: "Testbench external module interface unit"}
    include     : { name : "Includes",        ext: {cppm: "cppm"},           cond: {smartInclude: true},          mode: context, basePath: model,   desc: "yaml based include module interface"}
    config      : { name : "VariantConfig",   ext: {hdr: "h"},               cond: {smartInclude: true},          mode: context, basePath: model,   desc: "yaml based default config header"}
    #includeFW   : { name : "IncludesFW",      ext: {hdr: "h", src: "cpp"}, cond: {smartInclude: true},          mode: context, basePath: fwInc,   desc: "yaml based fw include file"}
    package     : { name : "_package",        ext: {sv: "sv"},             cond: {smartInclude: true},          mode: context, basePath: rtl,     desc: "yaml based package file"}
    # mode: project creates exactly one artifact per project at its basePath segment
    # root, keyed to the project's top context. rtl.f is the verilator file list (-F)
    # for the whole build, listing every package on that context's include chain.
    rtlDotF     : { name : "rtl",              ext: {f: "f"},                                                    mode: project, basePath: rtl,     desc: "Per-project verilator file list (rtl.f)"}
  # Create-once user-owned build makefiles. This is NOT a fileMap section: the
  # files carry no GENERATED_CODE regions, so make gen never touches them and the
  # build manifest never lists them; newModule writes each only if absent and never
  # rewrites it. `place` names a layout convention (root/include/rundir) or a
  # fileMap segment (rtl); `sub` is the file's path under that location.
  scaffold:
    template: $a2c/templates/fileGen/scaffold.py
    files:
      topMakefile : { place: root,    sub: "Makefile" }
      sharedMk    : { place: include, sub: "make/shared.mk" }
      rundirMk    : { place: rundir,  sub: "Makefile" }
      rtlMk       : { place: rtl,     sub: "Makefile" }
  fileCopyrightStatement: "Update your copywright statement in your project yaml file"
  regBlockNaming: {instancePrefix: 'u_', blockSuffix: '_regs'} # naming convention for register handler blocks - instancePrefix is prefix for instance names, blockSuffix is suffix for block names
postProcess:
  # Register-bus distribution: router index, leaf routing, register-handler
  # synthesis. A no-op when no block declares addressBlock:.
  - $a2c/config/postParseRegisterPorts.py
  - $a2c/config/postParseChecks.py

createArtifacts:
  - $a2c/config/createBuildManifest.py

# Project-level address policy (instanceGroups:, addressObjects:) is authored in
# the project's own project.yaml, not here. Legacy addressControl.yaml rows are
# still accepted; if both spellings are present their rows must match exactly.

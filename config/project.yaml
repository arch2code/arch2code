# Example project file that defines project level information
# note $a2c is automatically replaced with the path to the a2c directory
dbSchema: $a2c/config/schema.yaml

# System-level interface definitions - automatically loaded in all projects
# These are processed first and placed in _a2csystem context
systemFiles:
  - $a2c/interfaces/apb/apb_if.yaml
  - $a2c/interfaces/status/status_if.yaml
  - $a2c/interfaces/rdy_vld/rdy_vld_if.yaml
  - $a2c/interfaces/req_ack/req_ack_if.yaml
  - $a2c/interfaces/push_ack/push_ack_if.yaml
  - $a2c/interfaces/pop_ack/pop_ack_if.yaml
  - $a2c/interfaces/external_reg/external_reg_if.yaml
  - $a2c/interfaces/memory/memory_if.yaml
  - $a2c/interfaces/notify_ack/notify_ack_if.yaml
  - $a2c/interfaces/axi_read/axi_read_if.yaml
  - $a2c/interfaces/axi_write/axi_write_if.yaml
  - $a2c/interfaces/axi4_stream/axi4_stream_if.yaml
  - $a2c/interfaces/raw/raw_if.yaml

# Template mappings for code generation
templates:
  # SystemC/C++ templates
  classDecl: $a2c/templates/systemc/classDecl.py
  baseClassDecl: $a2c/templates/systemc/baseClassDecl.py
  constructor: $a2c/templates/systemc/constructor.py
  baseConstructor: $a2c/templates/systemc/baseConstructor.py
  blockRegs: $a2c/templates/systemc/blockRegs.py
  blockRegistrar: $a2c/templates/systemc/blockRegistrar.py
  moduleScaffold: $a2c/templates/systemc/moduleScaffold.py
  headers: $a2c/templates/systemc/headers.py
  includes: $a2c/templates/systemc/includes.py
  config: $a2c/templates/systemc/config.py
  structures: $a2c/templates/systemc/structures.py
  cpp_encoder: $a2c/templates/systemc/encoder.py
  module_hdl_sc_wrapper: $a2c/templates/systemc/module_hdl_wrapper.py
  tbExternal: $a2c/templates/systemc/testbench.py
  tbConfig: $a2c/templates/systemc/testbench.py
  testbench: $a2c/templates/systemc/testbench.py
  # SystemVerilog templates
  moduleInterfacesInstances: $a2c/templates/systemVerilog/moduleInterfacesInstances.py
  apbDecodeModule: $a2c/templates/systemVerilog/apbDecodeModule.py
  moduleRegs: $a2c/templates/systemVerilog/moduleRegs.py
  constantsTypesEnumsStructures: $a2c/templates/systemVerilog/constantsTypesEnumsStructures.py
  package: $a2c/templates/systemVerilog/package.py
  module_hdl_sv_wrapper: $a2c/templates/systemVerilog/module_hdl_wrapper.py
  encoder: $a2c/templates/systemVerilog/encoder.py
  rtlDotF: $a2c/templates/systemVerilog/rtldotf.py
  # Documentation templates
  blockHeader: $a2c/templates/doc/blockHeader.j2
  block: $a2c/templates/doc/block.j2
  connectionHeader: $a2c/templates/doc/connectionHeader.py
  structure: $a2c/templates/doc/structure.j2
  memories: $a2c/templates/doc/memories.py
  blockSpecification: $a2c/templates/doc/blockSpecification.py
  structDiagram: $a2c/templates/doc/structDiagram.py
  doctext: $a2c/templates/doc/doctext.py

dirs: # this is list of locations that can be referenced as base path in fileMap section
  #root: ../..                  # project root directory relative to project file - required to be supplied by
  base: $root/base             # for block base classes
  registrar: $root/registrar   # per-assembler block-registration trampolines + consumer-selected configs
  model: $root/model           # systemC model implementation
  rtl: $root/rtl               # RTL implementation
  vl_wrap: $root/verif/vl_wrap # rtl wrapper files
  tb: $root/tb                 # testbench definition files
  fwInc: $root/fw/include      # firmware include files

# this is a list of locations, orthogonal to design hierarchy, that maps out the functional layout of the project
# root defines the top level directory for the project, and other directories are defined relative to this.
# information about project directory structure to enable simplified maintenance
# and generation of file for new blocks. Note that directory structure will mirror
# architecture hierarchy.
fileGeneration:
  template: $a2c/templates/fileGen/fileGen.py
  # Project layout mode (decomposition vs functional axis ordering):
  #   functional   - functional axis outer: $root/<model|rtl|...>/<decomp>/file
  #                  (today's behavior; default for back-compat / no regression)
  #   hierarchical - decomposition axis outer: <node>/<model|rtl|...>/file
  # Selected per project file; a nested project uses its own setting.
  layout: functional
  # Directory defaults for hierarchical layout. The functional placement is the
  # top-level dirs: section (the compatibility surface); these are the
  # node-relative segments created beside each block's yaml/ in hierarchical
  # mode. The multi-level functional tails are flattened (verif/vl_wrap -> verif,
  # fw/include -> fw). yaml/prj/rundir/include are project-scope conventions, not
  # fileMap segments: yaml is the authored-YAML subdir of a node, prj is the
  # container for generated orphan artifacts, rundir is the per-project build dir,
  # and include is the user-owned build config. rundir and include stay at the
  # project root ($root-anchored) as user-owned entry points; only the generated
  # orphans live under prj/.
  hierarchicalDirs:
    base: base
    registrar: registrar
    model: model
    rtl: rtl
    tb: tb
    vl_wrap: verif      # flattened (functional: $root/verif/vl_wrap)
    fwInc: fw           # flattened (functional: $root/fw/include)
    yaml: yaml
    prj: $root/prj
    rundir: $root/rundir
    include: $root/include  # build config stays at project root (user-owned, not under prj/)
  # Build manifest groups for fileMap basePath segments. Artifact placement is
  # selected by fileMap[*].basePath; this map records how each segment
  # participates in generated build discovery.
  buildGroups:
    base: sc
    registrar: sc
    model: sc
    tb: sc
    fwInc: sc
    rtl: sv
    vl_wrap: vl
  fileMap:
    # generation has 2 modes, block and context
    # block creates a file per design block and cond: depend on the block definition
    # context creates a file per yaml file and cond: depend on the yaml file (typically this is for includes/packages)
    # name will be added to the module name to generate a filename plus associated extensions
    # path to the file is based on dirs section and otherwise follows block/yaml file structure
    # this means if blocks are defined in a file called cpu/cpu.yaml ie in the cpu directory then the implementation file is in cpu unless overridden in the block definition
    # if blockDirs is true then the file is placed in a directory the block appended as well
    # note that basePath should reference a path key in the dirs section
    # cond: matches fields in the block definition, if all fields are true then the file is generated
    # smartInclude is yaml based instead of block based and is used to generate include files based on the yaml file
    # if smartInclude is true then files are only created if there is content to include. If smartInclude: false then the file is always created
    blockBase   : { name : "Base",            ext: {cppm: "cppm"},         cond: {hasMdl: true, hasTb: true},   mode: block,   basePath: base,    desc: "Module Base class interface unit (Base/Inverted/Channels)"}
    # A parameterizable leaf block (hasOwnParams: declares its own params:, so
    # it is a template<typename Config> class) is emitted as a single C++20
    # module interface unit (blockModule, .cppm) whose member bodies are
    # module-visible so a consumer registrar can `import` it and instantiate
    # block<Config>. All other blocks (non-templated, including
    # container-parameterizable ones) keep the classic .h/.cpp split. The two
    # entries are mutually exclusive on hasOwnParams.
    block       : { name : "",                ext: {hdr: "h", src: "cpp"}, cond: {hasMdl: true}, condAnd: {hasOwnParams: false}, mode: block, basePath: model, desc: "Model implementation file (non-templated blocks)"}
    blockModule : { name : "",                ext: {cppm: "cppm"},         cond: {hasOwnParams: true}, condAnd: {hasMdl: true}, mode: block, basePath: model, desc: "Parameterizable block module interface unit (templated blocks)"}
    # blockRegistrar emits the per-assembler trampoline TUs described in
    # plan-reusable-ip-registrar.md. mode: registrar iterates each assembling
    # block and emits one <child>Registrar.cpp per distinct parameterizable
    # child it instantiates, under the assembler's directory in the registrar
    # root (mirroring how base mirrors the yaml tree). The cond/condAnd
    # predicate is applied to the instantiated child: only parameterizable
    # children with a model get a trampoline. Pure non-templated SC-only
    # blocks self-register from their own .cpp and gain no trampoline.
    blockRegistrar : { name : "Registrar",    ext: {cppm: "cppm"},         cond: {isParameterizable: true},  condAnd: {hasMdl: true}, mode: registrar, basePath: registrar, desc: "Per-assembler per-child trampoline registrar TU"}
    rtlModule   : { name : "",                ext: {sv: "sv"},             cond: {hasRtl: true},                mode: block,   basePath: rtl,     desc: "RTL implementation file"}
    vlSvWrap    : { name : "_hdl_sv_wrapper", ext: {sv: "sv"},             cond: {hasVl: true},                 mode: block,   basePath: vl_wrap, variant: true, desc: "SystemVerilog HDL module wrapper for verilator"}
    # Canonical parameterized SV wrapper body, emitted once per parameterizable
    # block as an include-only .svh that each variant trampoline `include`s.
    # Restricted to parameterizable VL blocks so non-parameterizable blocks emit
    # only their single .sv top (no .svh, no name collision).
    vlSvWrapBody: { name : "_hdl_sv_wrapper", ext: {svh: "svh"},           cond: {isParameterizable: true}, condAnd: {hasVl: true}, mode: block, basePath: vl_wrap, variant: false, desc: "Canonical parameterized SV wrapper body (include-only)"}
    vlScWrap    : { name : "_hdl_sc_wrapper", ext: {hdr: "h"},             cond: {hasVl: true},                 mode: block,   basePath: vl_wrap, desc: "SystemC Verilated HDL module derived class header file"}
    # plan-step-11-variant-aware-testbenches.md scope boundary: exactly one
    # testbench artifact and class family per block (no variant: true). The
    # `--variant` parameter is solely a generated-code parameter consumed by
    # templates to select the DUT Config and factory variant string.
    testBench   : { name : "Testbench",       ext: {hdr: "h", src: "cpp"}, cond: {hasTb: true}, blockDir: true, mode: block,   basePath: tb,    desc: "Testbench implementation file"}
    tbConfig    : { name : "Config",          ext: {src: "cpp"},           cond: {hasTb: true}, blockDir: true, mode: block,   basePath: tb,    desc: "Testbench config files"}
    tbExternal  : { name : "External",        ext: {hdr: "h", src: "cpp"}, cond: {hasTb: true}, blockDir: true, mode: block,   basePath: tb,    desc: "Testbench external files"}
    include     : { name : "Includes",        ext: {cppm: "cppm"},           cond: {smartInclude: true},          mode: context, basePath: model,   desc: "yaml based include module interface"}
    config      : { name : "VariantConfig",   ext: {hdr: "h"},               cond: {smartInclude: true},          mode: context, basePath: model,   desc: "yaml based default config header"}
    #includeFW   : { name : "IncludesFW",      ext: {hdr: "h", src: "cpp"}, cond: {smartInclude: true},          mode: context, basePath: fwInc,   desc: "yaml based fw include file"}
    package     : { name : "_package",        ext: {sv: "sv"},             cond: {smartInclude: true},          mode: context, basePath: rtl,     desc: "yaml based package file"}
  # standard copyright statement to be added to all generated files - change to suite your company
  fileCopyrightStatement: "Update your copywright statement in your project yaml file"
  regBlockNaming: {instancePrefix: 'u_', blockSuffix: '_regs'} # naming convention for register handler blocks - instancePrefix is prefix for instance names, blockSuffix is suffix for block names
postProcess:
  # Register-bus distribution. A no-op when no block declares
  # addressBlock:; otherwise it builds the router index, routes
  # register-owning leaves, and synthesises register handlers.
  - $a2c/config/postParseRegisterPorts.py
  - $a2c/config/postParseChecks.py

createArtifacts:
  - $a2c/config/createBuildManifest.py

# Top-level address-policy sections. Prefer these project.yaml fields for
# new or migrated projects; they normalize into the same ADDRESS_CONFIG state
# as the legacy addressControl.yaml InstanceGroups and AddressObjects sections.
# The legacy addressControl.yaml path is supported during migration but is
# expected to be deprecated.
# If both spellings are present, their rows must match exactly.
#
# instanceGroups:
#   <groupName>:
#     varType: <type name>
#     enumPrefix: <enum prefix>
#
# addressObjects:
#   <objectName>:
#     alignment: <memsize|number-of-bytes>
#     sizeRoundUpPowerOf2: <bool>
#     sortDescending: <bool>

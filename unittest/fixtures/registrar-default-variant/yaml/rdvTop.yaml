# One parameterized child, two sites in one container: one names a variant, one
# names none. Registration is a SystemC concern, so every block is model-only.

ipParameters:
    constants:
        RDV_ALGO: { value: 1, maxValue: 7, desc: "Algorithm select; behavioural only, appears in no width" }

types:
    rdvDataT: { width: 8, desc: "Fixed-width sample payload" }

structures:
    rdvSt:
        data: { varType: rdvDataT, desc: "Sample payload" }

interfaces:
    rdvIf:
        desc: "Sample push/ack stream"
        interfaceType: push_ack
        structures:
            - { structure: rdvSt, structureType: data_t }

blocks:
    rdvTop:
        desc: "DUT top"
        hasMdl: true
        hasTb: true
        hasRtl: false
        hasVl: false
    rdvTop_tb:
        desc: "Testbench container for rdvTop"
        hasRtl: false
        hasVl: false
    rdvDrv:
        desc: "Stimulus source for both leaf sites"
        hasMdl: true
        hasRtl: false
        hasVl: false
        ports:
            out:  { interface: rdvIf, direction: src }
            out2: { interface: rdvIf, direction: src }
    rdvCont:
        desc: "Container holding both leaf sites; declares the leaf's parameter"
        params: [RDV_ALGO]
        hasMdl: true
        hasRtl: false
        hasVl: false
        ports:
            contIn:  { interface: rdvIf, direction: dst }
            contIn2: { interface: rdvIf, direction: dst }
    rdvLeaf:
        desc: "Parameterized leaf reached at a variant and at its default Config"
        params: [RDV_ALGO]
        hasMdl: true
        hasRtl: false
        hasVl: false
        ports:
            in: { interface: rdvIf, direction: dst }
    rdvQuiet:
        desc: "Parameterized leaf the same two ways, verilated on demand; portless, so no stream waits on it"
        params: [RDV_ALGO]
        hasMdl: true
        hasRtl: true
        hasVl: true

instances:
    rdvTop_tb: { container: rdvTop_tb, instanceType: rdvTop_tb, instGroup: top }
    u_rdvTop:  { container: rdvTop_tb, instanceType: rdvTop,    instGroup: top }
    uDrv:      { container: rdvTop,    instanceType: rdvDrv,    instGroup: top }
    uCont:     { container: rdvTop,    instanceType: rdvCont,   instGroup: top, variant: cont }
    # THE CELL: one parameterized child, one site naming a variant and one
    # naming none.
    uLeafVar:  { container: rdvCont,   instanceType: rdvLeaf,   instGroup: top, variant: tuned }
    uLeafDef:  { container: rdvCont,   instanceType: rdvLeaf,   instGroup: top }
    uQuietVar: { container: rdvCont,   instanceType: rdvQuiet,  instGroup: top, variant: tuned }
    uQuietDef: { container: rdvCont,   instanceType: rdvQuiet,  instGroup: top }

connections:
    - { interface: rdvIf, src: uDrv, srcport: out,  dst: uCont, dstport: contIn }
    - { interface: rdvIf, src: uDrv, srcport: out2, dst: uCont, dstport: contIn2 }

connectionMaps:
    - { interface: rdvIf, block: rdvCont, port: contIn,  direction: dst, instance: uLeafVar, instancePort: in }
    - { interface: rdvIf, block: rdvCont, port: contIn2, direction: dst, instance: uLeafDef, instancePort: in }

parameters:
    rdvCont:
        cont:
            RDV_ALGO: 5
    rdvLeaf:
        tuned:
            RDV_ALGO: 5
    rdvQuiet:
        tuned:
            RDV_ALGO: 5

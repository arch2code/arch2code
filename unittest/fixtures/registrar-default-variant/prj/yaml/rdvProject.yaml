# Single-project cell: one parameterized child instantiated twice by one
# container, once naming a variant and once naming none.

yamlFormat: 2
projectName: rdvTest

projectFiles:
    - ../../yaml/rdvTop.yaml

topInstance: rdvTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

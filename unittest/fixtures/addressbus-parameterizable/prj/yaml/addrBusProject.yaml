# Single-project cell: a register-bus interface carrying a parameterizable
# data structure.

yamlFormat: 2
projectName: addrBusTest

projectFiles:
    - ../../yaml/addrBus.yaml

topInstance: top_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

# Reusable leaf IP project: no instances and no topInstance. Each integrator
# instantiates fLeaf at variants of its own.

yamlFormat: 2
projectName: vbwLeaf

projectFiles:
    - ../../yaml/vbwLeaf.yaml

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

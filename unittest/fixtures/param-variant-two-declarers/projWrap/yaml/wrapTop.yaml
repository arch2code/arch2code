# projWrap: the integration wrapper that owns the leaf's config context. It
# declares its own parameter, payload and interface, holds the leaf instance, and
# routes its own boundary port to the leaf through a connectionMap whose parent
# interface is its own.
#
# That map is what moves the leaf's config context downstream to THIS file: the
# leaf's parameterizable surface is reached through the map's parent interface,
# which is declared here. So this project emits the leaf's per-variant Config
# struct, and its binding of v0 is the one every consumer must resolve to.
include:
    - ../../projIp/yaml/ipTop.yaml

ipParameters:
    constants:
        WRAP_W: { value: 8, maxValue: 32, desc: "wrapper payload width" }
    types:
        wrapT: { width: WRAP_W, maxBitwidth: 32, desc: "wrapper parameterizable payload word" }

structures:
    wrapSt:
        data: { varType: wrapT, desc: "wrapper payload" }

interfaces:
    wrapIf:
        desc: "wrapper parameterized push/ack stream"
        interfaceType: push_ack
        structures:
            - { structure: wrapSt, structureType: data_t }

blocks:
    wrapBlk:
        desc: "integration wrapper routing its boundary port to the leaf IP"
        params: [WRAP_W]
        ports:
            in: { interface: wrapIf, direction: dst }

instances:
    uLeaf: { container: wrapBlk, instanceType: leafIp, variant: v0 }

connectionMaps:
    - { interface: wrapIf, block: wrapBlk, port: in, direction: dst, instance: uLeaf, instancePort: in }

parameters:
    wrapBlk:
        v0:
            WRAP_W: 8
    leafIp:
        v0:
            LEAF_W: 8

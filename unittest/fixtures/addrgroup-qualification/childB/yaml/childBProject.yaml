# childB PROJECT file. Reached through the root's projectFiles: slot and
# carrying the project sentinel set, so projectName childBProj owns this context
# and its whole transitive closure (childBTop.yaml), including the address group
# declared there.
projectName: childBProj

projectFiles:
    - childBTop.yaml

dirs:
    root: ..

fileGeneration:
    template: none
    # This project's own fileMap names its firmware headers, in the composed
    # build as on its own.
    fileMap:
        includeFW: { name: "IncludesFW", ext: {hdr: "h", src: "cpp"}, cond: {smartInclude: true}, mode: context, basePath: fwInc, desc: "yaml based fw include file" }

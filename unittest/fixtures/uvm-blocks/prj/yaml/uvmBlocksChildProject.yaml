# A root around the child project's hasUvm DUT.

yamlFormat: 2
projectName: uvmBlocksChild

projectFiles:
    - ../../child/prj/yaml/ubChildProject.yaml
    - ../../yaml/uvmBlocksChild.yaml

topInstance: ubChildTb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

# A hasUvm DUT between a stream source and sink, with its registers on an APB
# router the CPU drives.

yamlFormat: 2
projectName: uvmBlocks

projectFiles:
    - ../../yaml/uvmBlocks.yaml

topInstance: ubTb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

include:
  - axiStd.yaml

constants:
  AXI_ADDRESS_WIDTH: {value: 32, desc: "The width of the AXI address busses"}
  AXI_DATA_WIDTH: {value: 32, desc: "The width of the AXI data busses"}
  AXI_STROBE_WIDTH: {value: 4, desc: "The width of the AXI strobe signals"}

types:
  axiAddrT:
    width: AXI_ADDRESS_WIDTH
    desc: "Address Width"
  axiDataT:
    width: AXI_DATA_WIDTH
    desc: "Width of the data bus."
  axiStrobeT:
    width: AXI_STROBE_WIDTH
    desc: "Width of the strobe bus."

structures:
  axiAddrSt:
    addr: {varType: axiAddrT}
  axiDataSt:
    data: {varType: axiDataT}
  axiStrobeSt:
    strobe: {varType: axiStrobeT}

interfaces:
  axiRdIf:
    desc: "AXI Read channels; Address and Data"
    interfaceType: axi_read
    multiCycleMode: api_list_size
    maxTransferSize: 256
    structures:
      - {structure: axiAddrSt, structureType: addr_t}
      - {structure: axiDataSt, structureType: data_t}
  axiWrIf:
    desc: "AXI Write channels; Address, Data, and Response"
    interfaceType: axi_write
    multiCycleMode: api_list_size
    maxTransferSize: 256
    structures:
      - {structure: axiAddrSt, structureType: addr_t}
      - {structure: axiDataSt, structureType: data_t}
      - {structure: axiStrobeSt, structureType: strb_t}

blocks:
  axiSocketSlave_tb:
    desc: "Testbench top (SystemC master + Python memory slave over sockets)"
    hasVl: false
    hasRtl: false
    hasMdl: true
    hasTb: false
    clocks:
      clk: { default: true, period: 4, timeUnit: ns }
    resets:
      rst_n: { clock: clk }
  producer:
    desc: "AXI master initiating read and write bursts"
    hasVl: false
    hasRtl: false
    hasMdl: true
    hasTb: false
  axiSocket:
    desc: "Socket shell facing Python AXI memory slave"
    hasVl: false
    hasRtl: false
    hasMdl: true
    hasTb: true
    hasSkt: true
  dummyVl:
    desc: "The only hasVl block in this fixture, with no data ports; its own clk is driven by the wrapper's lockstep-gated clock_gen thread. A VCD trace of this instance (--vlInst axiSocketSlave_tb.u_dummyVl --vlTrace) lets a test observe, from outside the wrapper, whether clk kept toggling after the axi socket link loss trips the process-wide lockstep gate."
    hasVl: true
    hasRtl: true
    hasMdl: true
    hasTb: false
    clocks:
      clk: { default: true, period: 4, timeUnit: ns }
    resets:
      rst_n: { clock: clk }

instances:
  axiSocketSlave_tb: {container: axiSocketSlave_tb, instanceType: axiSocketSlave_tb, instGroup: top,
                       clocks: { clk: clk }, resets: { rst_n: rst_n } }
  u_producer:        {container: axiSocketSlave_tb, instanceType: producer, instGroup: top}
  u_axiSocket:       {container: axiSocketSlave_tb, instanceType: axiSocket, instGroup: top}
  u_dummyVl:         {container: axiSocketSlave_tb, instanceType: dummyVl, instGroup: top,
                       clocks: { clk: clk }, resets: { rst_n: rst_n } }

connections:
  - {interface: axiRdIf, src: u_producer, dst: u_axiSocket, name: axiRd0}
  - {interface: axiWrIf, src: u_producer, dst: u_axiSocket, name: axiWr0}

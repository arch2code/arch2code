# bpeLeaf names BASE_WIDTH and DERIVED_WIDTH, an eval-derived constant over
# BASE_WIDTH, and one variant binds both.

ipParameters:
    constants:
        BASE_WIDTH: { value: 4, maxValue: 16, desc: "Base width" }

constants:
    DERIVED_WIDTH: { eval: "$BASE_WIDTH * 2", desc: "Derived width, 2x base" }

blocks:
    bpeTop:
        desc: "DUT top"
        hasMdl: true
        hasTb: true
        hasRtl: false
        hasVl: false
    bpeTop_tb:
        desc: "Testbench container for bpeTop"
        hasRtl: false
        hasVl: false
    bpeLeaf:
        desc: "Leaf whose params: names an eval-derived backing constant"
        hasMdl: true
        hasRtl: false
        hasVl: false
        params: [BASE_WIDTH, DERIVED_WIDTH]

instances:
    bpeTop_tb: { container: bpeTop_tb, instanceType: bpeTop_tb, instGroup: top }
    u_bpeTop:  { container: bpeTop_tb, instanceType: bpeTop,    instGroup: top }
    uLeaf:     { container: bpeTop,    instanceType: bpeLeaf,   instGroup: top, variant: solo }

parameters:
    bpeLeaf:
        solo:
            BASE_WIDTH: 4
            DERIVED_WIDTH: 20

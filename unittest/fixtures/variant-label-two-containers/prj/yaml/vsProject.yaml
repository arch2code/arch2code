# Single-project cell: one inheriting leaf under two containers that declare the
# same variant label. inheritContainerParam requires each container and the child
# to share one owning project, so this cell is not composed.

yamlFormat: 2
projectName: vsTest

projectFiles:
    - ../../yaml/vsTop.yaml

topInstance: vsTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

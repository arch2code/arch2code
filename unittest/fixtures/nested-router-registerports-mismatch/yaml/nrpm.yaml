# A container hosting a nested register-bus router, served itself as a
# routed leaf of the primary router. Its `registerPorts:` key must equal
# the nested router's `addressBlock.upstreamPort`: the boundary map that
# feeds the nested router wires the container's own registerPorts port
# straight through, by name, to that upstreamPort.
#
# `container` below declares the key `regBus`, but `nestedApbDecode`
# names `apbReg` as its upstreamPort. Mismatched on purpose.

constants:
    ADDR_WIDTH: { value: 32, desc: "Register bus address width" }
    DATA_WIDTH: { value: 32, desc: "Register bus data width" }
    CFG_WIDTH:  { value: 16, desc: "cfg register payload width" }

types:
    apbAddrT: { width: ADDR_WIDTH, desc: "APB address" }
    apbDataT: { width: DATA_WIDTH, desc: "APB data" }
    cfgT:     { width: CFG_WIDTH,  desc: "cfg register payload" }

structures:
    apbAddrSt:
        address: { varType: apbAddrT, generator: address }
    apbDataSt:
        data: { varType: apbDataT, generator: data }
    cfgRegSt:
        value: { varType: cfgT, generator: register, desc: "cfg payload" }

interfaces:
    apbReg:
        desc: "APB register bus"
        interfaceType: apb
        structures:
            - { structure: apbAddrSt, structureType: addr_t }
            - { structure: apbDataSt, structureType: data_t }

blocks:
    top_tb:
        desc: "Root testbench container"
        hasMdl: false
        hasTb: false
        hasRtl: false
        hasVl: false
    top:
        desc: "DUT top"
        hasMdl: true
        hasTb: false
        hasRtl: false
        hasVl: false
    cpu:
        desc: "APB master"
        hasMdl: true
        hasRtl: false
        hasVl: false
    apbDecode:
        desc: "Primary register-bus router"
        hasMdl: true
        hasRtl: false
        hasVl: false
        addressBlock:
            addressGroup: top
            addressIncrement: 0x01000000
            maxAddressSpaces: 16
            varType: addr_id_top
            enumPrefix: ADDR_ID_TOP_
            upstreamPort: apbReg
            registerDecoderPort: apbReg
    container:
        desc: "Nested-router host, itself a routed leaf of apbDecode"
        hasMdl: true
        hasRtl: false
        hasVl: false
        registerPorts:
            regBus: { interface: apbReg }
    nestedApbDecode:
        desc: "Nested register-bus router inside container"
        hasMdl: true
        hasRtl: false
        hasVl: false
        addressBlock:
            addressGroup: bridge
            addressIncrement: 0x00100000
            maxAddressSpaces: 16
            varType: addr_id_bridge
            enumPrefix: ADDR_ID_BRIDGE_
            upstreamPort: apbReg
            registerDecoderPort: apbReg
    leaf:
        desc: "Routed leaf served by nestedApbDecode"
        hasMdl: true
        hasRtl: false
        hasVl: false

instances:
    top_tb:            { container: top_tb,    instanceType: top_tb,        instGroup: top }
    u_top:             { container: top_tb,    instanceType: top,           instGroup: top }
    uCpu:              { container: top,       instanceType: cpu,           instGroup: top }
    uApbDecode:        { container: top,       instanceType: apbDecode,     instGroup: top }
    uContainer:        { container: top,       instanceType: container,     instGroup: top, addressGroup: top }
    uNestedApbDecode:  { container: container, instanceType: nestedApbDecode, instGroup: top }
    uLeaf:             { container: container, instanceType: leaf,          instGroup: top, addressGroup: bridge }

connections:
    - { interface: apbReg, src: uCpu, dst: uApbDecode, name: cpu_main }

registers:
    - { register: cfg, regType: rw, block: leaf, structure: cfgRegSt, desc: "Test register" }

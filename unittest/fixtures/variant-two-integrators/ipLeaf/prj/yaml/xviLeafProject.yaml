# Reusable leaf IP project. No instances and no topInstance: it is generated by
# its own make gen and instantiated by each integrator.

yamlFormat: 2
projectName: xviLeaf

projectFiles:
    - ../../yaml/xviLeaf.yaml

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

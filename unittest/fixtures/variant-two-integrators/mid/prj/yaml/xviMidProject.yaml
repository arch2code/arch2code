# The first integrator's project. It references the leaf IP project and owns the
# design file that both instantiates the leaf and binds label v0 at gain 7.

yamlFormat: 2
projectName: xviMid

topInstance: xviMidTop_tb

projectFiles:
    - ../../../ipLeaf/prj/yaml/xviLeafProject.yaml
    - ../../yaml/xviMid.yaml

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

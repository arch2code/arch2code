# Root-owned top context: minimal valid testbench container plus one leaf so
# the composition builds. The provider/mid child blocks are not instantiated
# (definition-only), which is sufficient to exercise provider selection.
blocks:
    root_tb:
        desc: "root testbench container"
        hasVl: false
        hasRtl: false
        hasMdl: false
        hasTb: false
    rootLeaf:
        desc: "root-owned leaf block"
        hasMdl: true
        hasRtl: false

instances:
    root_tb:
        container: root_tb
        instanceType: root_tb
        instGroup: top
    uRootLeaf:
        container: root_tb
        instanceType: rootLeaf
        instGroup: top

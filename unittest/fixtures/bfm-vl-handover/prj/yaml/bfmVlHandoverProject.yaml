# A Verilated FIFO between a model source and a model sink, joined through the
# rdy_vld BFMs.

yamlFormat: 2
projectName: bfmVlHandover

topInstance: bvhTop_tb

projectFiles:
    - ../../yaml/bvh.yaml

clocks:
    clk:
        desc: "testbench clock"
        default: true
        period: 10
        timeUnit: ns

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

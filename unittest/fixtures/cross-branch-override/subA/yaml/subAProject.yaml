# Sub-project subA. Declares a projectOverride redirecting `shared` onto the
# standalone vendor copy, but references NO `shared` copy of its own - so subA's
# branch never opens a `shared` scope and the branch-local redirect never fires.
# The override still folds into the GLOBAL effective map, making the vendor copy
# the reconciled master for `shared`.
projectName: subA

projectFiles:
    - subALeaf.yaml

projectOverrides:
    shared: ../../vendor/shared/yaml/sharedProject.yaml

dirs:
    root: ..

fileGeneration:
    template: none

blocks:
    subABlock:
        desc: "block owned by sub-project subA"
        hasMdl: true
        hasRtl: false

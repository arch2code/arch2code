# Assembler context: instantiate all three IPs and wire the parameterized
# interface straight through, A -> B -> C. The assembler declares no interface of
# its own, so each connection's interface reference `dataIf` resolves in the
# assembler's own scope to the first same-named interface its include chain
# offers, while each endpoint block's port carries its OWN project's dataIf.
#
# The three WIDTH constants are three distinct parameter identities, so the
# parameterized-endpoint validator must reject this wiring. The assembler owns
# the per-use-case variant bindings.
include:
    - ../../projA/yaml/aTop.yaml
    - ../../projB/yaml/bTop.yaml
    - ../../projC/yaml/cTop.yaml

blocks:
    top:
        desc: "assembler top"

instances:
    uTop: { container: top, instanceType: top }
    uA:   { container: top, instanceType: aIp, variant: v0 }
    uB:   { container: top, instanceType: bIp, variant: v0 }
    uC:   { container: top, instanceType: cIp, variant: v0 }

connections:
    - { interface: dataIf, src: uA, srcport: out, dst: uB, dstport: in }
    - { interface: dataIf, src: uB, srcport: out, dst: uC, dstport: in }

parameters:
    aIp:
        v0:
            WIDTH: 8
    bIp:
        v0:
            WIDTH: 8
    cIp:
        v0:
            WIDTH: 8

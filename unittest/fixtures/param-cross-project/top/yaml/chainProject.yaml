yamlFormat: 2

# Assembler for the three-project parameterized chain: projA -> projB -> projC,
# each an independently authored parameterized IP declaring its own same-named
# WIDTH and its own same-named parameterized interface dataIf.
projectName: chainTopProj

projectFiles:
    - ../../projA/yaml/aProject.yaml
    - ../../projB/yaml/bProject.yaml
    - ../../projC/yaml/cProject.yaml
    - chainTop.yaml

topInstance: uTop

dirs:
    root: ..

fileGeneration:
    template: none

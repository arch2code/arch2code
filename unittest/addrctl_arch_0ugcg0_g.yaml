constants:
    ADDR_WIDTH: { value: 32, desc: "Register bus address width" }
    DATA_WIDTH: { value: 32, desc: "Register bus data width" }
    REG_WIDTH:  { value: 16, desc: "Register payload width" }

types:
    apbAddrT: { width: ADDR_WIDTH, desc: "APB address" }
    apbDataT: { width: DATA_WIDTH, desc: "APB data" }
    cfgT:     { width: REG_WIDTH,  desc: "Register payload" }

structures:
    apbAddrSt:
        address: { varType: apbAddrT, generator: address }
    apbDataSt:
        data: { varType: apbDataT, generator: data }
    cfgRegSt:
        value: { varType: cfgT, generator: register, desc: "Register payload" }

interfaces:
    apbReg:
        desc: "APB register bus"
        interfaceType: apb
        structures:
            - { structure: apbAddrSt, structureType: addr_t }
            - { structure: apbDataSt, structureType: data_t }

blocks:
    top:
        desc: "Primary router container"
        hasMdl: true
    sub:
        desc: "Nested router container"
        hasMdl: true
    apbDecode:
        desc: "Router block 'apbDecode'"
        hasMdl: true
        addressBlock:
            addressGroup: top
            addressIncrement: 0x01000000
            maxAddressSpaces: 16
            varType: addr_id_top
            enumPrefix: ADDR_ID_TOP_
            upstreamPort: apbReg
            registerDecoderPort: apbReg
    subDecode:
        desc: "Router block 'subDecode'"
        hasMdl: true
        addressBlock:
            addressGroup: sub
            addressIncrement: 0x01000000
            maxAddressSpaces: 16
            varType: addr_id_sub
            enumPrefix: ADDR_ID_SUB_
            upstreamPort: apbReg
            registerDecoderPort: apbReg
    topLeaf:
        desc: "Routed leaf block 'topLeaf'"
        hasMdl: true
        registerPorts:
            regs: { interface: apbReg }
    subLeaf:
        desc: "Routed leaf block 'subLeaf'"
        hasMdl: true
        registerPorts:
            regs: { interface: apbReg }

instances:
    uTop:        { container: top, instanceType: top }
    uAPBDecode:  { container: top, instanceType: apbDecode }
    uSub:        { container: top, instanceType: sub }
    uSubDecode:  { container: sub, instanceType: subDecode }
    uTopLeaf:    { container: top, instanceType: topLeaf, addressGroup: top }
    uSubLeaf:    { container: sub, instanceType: subLeaf, addressGroup: sub }

registers:
    - { register: cfgT, regType: rw, block: topLeaf, structure: cfgRegSt, desc: "" }
    - { register: cfgS, regType: rw, block: subLeaf, structure: cfgRegSt, desc: "" }

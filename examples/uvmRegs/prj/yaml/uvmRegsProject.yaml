# uvmRegs: a UVM testbench whose DUT reaches its registers through routers.
# The DUT owns no registers itself, so its register model has one block per
# instance on the way to them (SIMULATOR_INTEGRATION.md section 9.5).

yamlFormat: 2
projectName: uvmRegs

projectFiles:
    - ../../yaml/uvmRegs.yaml

topInstance: uvmRegs_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    fileCopyrightStatement: "copyright the arch2code project contributors, see https://github.com/arch2code/arch2code/blob/main/LICENSE"

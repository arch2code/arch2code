# Probe project for the layout gate on an inheritContainerParam child,
# REJECTING arm: `make db` is required to fail here. Single project, so the
# mismatch it carries is intra-project. Adjudicated at make db only; nothing
# here is built.

yamlFormat: 2
projectName: xpInhLayoutBad

projectFiles:
    - ../../yaml/xpInhLayoutBadTop.yaml

topInstance: xpInhLayoutBadTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

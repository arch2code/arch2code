# Probe project for the inferred-port Config gate, REJECTING arm: `make db`
# is required to fail here. Single project, so the mismatch it carries is
# intra-project. Adjudicated at make db only; nothing here is built.

yamlFormat: 2
projectName: xpInfPortBad

projectFiles:
    - ../../yaml/xpIpbTop.yaml

topInstance: xpIpbTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

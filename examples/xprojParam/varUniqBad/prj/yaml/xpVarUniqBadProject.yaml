# Probe project for the variant-name uniqueness gate, rejecting arm.
# Adjudicated at make db only; nothing here is built.

yamlFormat: 2
projectName: xpVarUniqBad

projectFiles:
    - ../../yaml/xpVarUniqBadBase.yaml
    - ../../yaml/xpVarUniqBadExtra.yaml
    - ../../yaml/xpVarUniqBadTop.yaml

topInstance: xpVarUniqBadTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

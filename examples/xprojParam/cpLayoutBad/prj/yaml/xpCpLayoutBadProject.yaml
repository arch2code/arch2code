# Probe project for the site-keyed layout gate, accepting arm. Adjudicated at
# make db only; nothing here is built.

yamlFormat: 2
projectName: xpCpLayoutBad

projectFiles:
    - ../../yaml/xpCpLayoutBadTop.yaml

topInstance: xpCpLayoutBadTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

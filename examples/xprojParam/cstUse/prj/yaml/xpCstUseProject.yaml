# Probe project for the shared-constant family: the prescribed include-scope
# param shape carrying a non-default value. Rejected at make db; see
# ../../yaml/xpCstUseTop.yaml.

yamlFormat: 2
projectName: xpCstUse

projectFiles:
    - ../../../cstIp/prj/yaml/xpCstIpProject.yaml
    - ../../yaml/xpCstUseTop.yaml

topInstance: xpCstUseTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

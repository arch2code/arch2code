# Chain middle stage, independently authored. Every declaration name matches the
# upstream and downstream stage projects, but each is owned by this project and
# therefore a distinct identity.

ipParameters:
    constants:
        PIXEL_WIDTH: { value: 8, maxValue: 32, desc: "Per-instance pixel width" }
    types:
        pixel_t: { width: PIXEL_WIDTH, maxBitwidth: 32, desc: "Parameterizable pixel word" }

types:
    tag_t: { width: 4, desc: "Sample sequence tag" }

structures:
    videoSt:
        tag:  { varType: tag_t,   desc: "Sample sequence tag" }
        data: { varType: pixel_t, desc: "Pixel payload" }

interfaces:
    videoIf:
        desc: "Parameterized pixel push/ack stream"
        interfaceType: push_ack
        structures:
            - { structure: videoSt, structureType: data_t }

blocks:
    xpFilter:
        desc: "Chain middle stage: adds a fixed offset to every pixel"
        params: [PIXEL_WIDTH]
        hasMdl: true
        hasVl: false
        hasTb: false
        hasRtl: false
        ports:
            videoIn:  { interface: videoIf, direction: dst }
            videoOut: { interface: videoIf, direction: src }

parameters:
    xpFilter:
        v0:
            PIXEL_WIDTH: 8

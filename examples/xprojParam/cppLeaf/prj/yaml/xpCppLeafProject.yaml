# Consumer IP project for the C++-definition axis. No instances and no
# topInstance: a reusable IP generated by its own make gen and instantiated by
# the assembler's wrapper.

yamlFormat: 2
projectName: xpCppLeaf

projectFiles:
    - ../../yaml/xpCppLeaf.yaml

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

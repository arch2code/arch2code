# Probe project for the inferred-port Config gate, ACCEPTING arm: `make db`
# is required to pass here. Single project, so nothing here is built.

yamlFormat: 2
projectName: xpInfPort

projectFiles:
    - ../../yaml/xpInfTop.yaml

topInstance: xpInfTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

# Sink stage project, independently authored: it declares its own PIXEL_WIDTH
# and its own videoIf under the same names the other stage projects use.

yamlFormat: 2
projectName: xpSink

projectFiles:
    - ../../yaml/xpSink.yaml
    - ../../yaml/xpSinkUniq.yaml

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

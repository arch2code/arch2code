# Probe project for the layout gate on an inheritContainerParam child,
# accepting arm. Adjudicated at make db only; nothing here is built.

yamlFormat: 2
projectName: xpInhLayout

projectFiles:
    - ../../yaml/xpInhLayoutTop.yaml

topInstance: xpInhLayoutTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

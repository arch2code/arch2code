# A shared, definitions-only file declaring one parameter, consumed by two
# unrelated including files at a non-default bound value.

yamlFormat: 2
projectName: xpCstShared

projectFiles:
    - ../../yaml/xpCstSharedTop.yaml

topInstance: xpCstSharedTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

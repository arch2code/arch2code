# Assembler project for the shared-declaration composition. It references the
# upstream stage project plus the two downstream stage projects that reach the
# upstream declarations through include:.

yamlFormat: 2
projectName: xpShared

projectFiles:
    - ../../../filterShared/prj/yaml/xpFilterSharedProject.yaml
    - ../../../sinkShared/prj/yaml/xpSinkSharedProject.yaml
    - ../../yaml/xpSharedTop.yaml

topInstance: xpSharedTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

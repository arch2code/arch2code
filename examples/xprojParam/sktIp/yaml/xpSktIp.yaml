# Reusable parameterizable IP with a Python socket shell. The IP declares only
# its own default variant; sktAsm declares a second one this build never sees.

ipParameters:
    constants:
        SK_PIXEL_WIDTH: { value: 8, maxValue: 16, desc: "Per-instance pixel width; the IP's own default" }
    types:
        skPixelT: { width: SK_PIXEL_WIDTH, maxBitwidth: 16, desc: "Parameterizable pixel word" }

types:
    skTagT: { width: 8, desc: "Sample sequence tag" }

structures:
    skSampleSt:
        tag:  { varType: skTagT,   desc: "Sample sequence tag" }
        data: { varType: skPixelT, desc: "Parameterizable pixel payload" }

interfaces:
    skSampleIf:
        desc: "The IP's parameterized sample push/ack stream"
        interfaceType: push_ack
        structures:
            - { structure: skSampleSt, structureType: data_t }

blocks:
    xpSktLeaf:
        desc: "Parameterizable sample source; its socket shell lets Python drive the output"
        params: [SK_PIXEL_WIDTH]
        hasMdl: true
        hasSkt: true
        hasVl: false
        hasTb: false
        hasRtl: false
        ports:
            out: { interface: skSampleIf, direction: src }

parameters:
    xpSktLeaf:
        dflt:
            SK_PIXEL_WIDTH: SK_PIXEL_WIDTH

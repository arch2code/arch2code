# Reusable IP project for the socket-shell family. No instances and no
# topInstance: generated by its own make gen, instantiated by sktAsm.

yamlFormat: 2
projectName: xpSktIp

projectFiles:
    - ../../yaml/xpSktIp.yaml

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

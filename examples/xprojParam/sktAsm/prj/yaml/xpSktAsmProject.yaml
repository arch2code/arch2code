# Assembler for the socket-shell family. It references the IP project and
# declares its own variant of the IP's socket-enabled leaf.

yamlFormat: 2
projectName: xpSktAsm

projectFiles:
    - ../../../sktIp/prj/yaml/xpSktIpProject.yaml
    - ../../yaml/xpSktAsmTop.yaml

topInstance: xpSktAsmTop

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

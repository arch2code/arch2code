# Project for the two-context block experiment.

yamlFormat: 2
projectName: xpTwoCtx

projectFiles:
    - ../../../dpLeaf/prj/yaml/xpDpLeafProject.yaml
    - ../../yaml/xpTwoCtx.yaml

topInstance: xpTwoCtxTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

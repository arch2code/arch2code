# Assembler project for the C++-definition axis composition. It references the
# consumer IP project so the IP's declarations stay owned by their author and
# only this project's own blocks are generated here.

yamlFormat: 2
projectName: xpCppAxis

projectFiles:
    - ../../../cppLeaf/prj/yaml/xpCppLeafProject.yaml
    - ../../yaml/xpCppAxisTop.yaml

topInstance: xpCppAxisTop_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    template: $a2c/templates/fileGen/fileGen.py
    fileCopyrightStatement: ""

# uvmReuse: a composed root that reuses the UVM code of its child project's
# block (SIMULATOR_INTEGRATION.md section 9.15). Its DUT, uvmReuseChain, chains
# two uvmReuseLeaf instances: uLeafA at the leaf's w8 variant, and uLeafB at
# the width uvmReuseChain's variant gives it, which is w8 in v8 and w4 in v4.

yamlFormat: 2
projectName: uvmReuse

projectFiles:
    - ../../leaf/prj/yaml/uvmReuseLeafProject.yaml
    - ../../yaml/uvmReuse.yaml

topInstance: uvmReuse_tb

clocks:
    clk:
        desc: "Datapath and register bus clock"
        default: true
        period: 1
        timeUnit: ns
    clkAux:
        desc: "Clock of uTick and uTock"
        period: 3
        timeUnit: ns

resets:
    rst_n:
        desc: "clk domain reset"
        default: true
        clock: clk
    rstAux_n:
        desc: "clkAux domain reset"
        clock: clkAux

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    fileCopyrightStatement: "copyright the arch2code project contributors, see https://github.com/arch2code/arch2code/blob/main/LICENSE"

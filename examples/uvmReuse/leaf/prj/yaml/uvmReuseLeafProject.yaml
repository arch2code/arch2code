# uvmReuseLeaf: the child project of the uvmReuse example. Its one block,
# uvmReuseLeaf, has a UVM bench of its own, one top per standalone variant,
# and uvmReuse reuses its variant packages (SIMULATOR_INTEGRATION.md section
# 9.15).

yamlFormat: 2
projectName: uvmReuseLeaf

projectFiles:
    - ../../yaml/uvmReuseLeaf_tb.yaml

topInstance: uvmReuseLeaf_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..

fileGeneration:
    layout: hierarchical
    fileCopyrightStatement: "copyright the arch2code project contributors, see https://github.com/arch2code/arch2code/blob/main/LICENSE"

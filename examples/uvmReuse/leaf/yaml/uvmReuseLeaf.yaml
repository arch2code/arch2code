# uvmReuseLeaf adds its offset register to each word of a stream of packets
# and passes last through. Each beat is one word, with last set on a packet's
# final beat. Its two standalone variants differ in the width of offset.

ipParameters:
    constants:
        UVM_REUSE_OFF_W: { value: 4, maxValue: 8, desc: "Width of the offset register" }

types:
    uvmReuseWordT: { width: 16, desc: "One data word" }
    uvmReuseBitT: { width: 1, desc: "A one-bit flag" }
    uvmReuseBusT: { width: 32, desc: "Register bus address and data" }
    uvmReuseOffT: { width: UVM_REUSE_OFF_W, desc: "Offset added to each word" }

structures:
    uvmReuseBeatSt:
        word: { varType: uvmReuseWordT, desc: "Data word" }
        last: { varType: uvmReuseBitT, desc: "Final beat of a packet" }
    uvmReuseAddrSt:
        address: { varType: uvmReuseBusT, generator: address }
    uvmReuseDataSt:
        data: { varType: uvmReuseBusT, generator: data }
    uvmReuseOffSt:
        offset: { varType: uvmReuseOffT, desc: "Added to each word" }

interfaces:
    uvmReuseStreamIf:
        interfaceType: rdy_vld
        desc: "Packets, one word per beat"
        structures:
            - { structure: uvmReuseBeatSt, structureType: data_t }
    apbReg:
        interfaceType: apb
        desc: "Register bus"
        structures:
            - { structure: uvmReuseAddrSt, structureType: addr_t }
            - { structure: uvmReuseDataSt, structureType: data_t }

blocks:
    uvmReuseLeaf:
        desc: "Adds offset to each word"
        hasVl: true
        hasRtl: true
        hasMdl: true
        hasTb: false
        hasUvm: true
        params: [UVM_REUSE_OFF_W]
        clocks:
            clk: { default: true, period: 1, timeUnit: ns }
        resets:
            rst_n: { clock: clk }
        ports:
            in:  { interface: uvmReuseStreamIf, direction: dst }
            out: { interface: uvmReuseStreamIf, direction: src }
        registerPorts:
            apbReg: { interface: apbReg }

registers:
    - { register: offset, regType: rw, block: uvmReuseLeaf, structure: uvmReuseOffSt, defaultValue: 1, desc: "Added to each word" }

parameters:
    uvmReuseLeaf:
        w4: { UVM_REUSE_OFF_W: 4 }
        w8: { UVM_REUSE_OFF_W: 8 }

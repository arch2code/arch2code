# ipBridge standalone top harness.
#
# ipBridge has no hasTb block of its own, so this harness assembles a runnable
# top: the ipBridge DUT, the bridgeDriver stimulus producer, and a top-down cpu
# APB master. ipBridge's register bus lives entirely inside the IP: its nested
# bridgeApbDecode router is the only decoder in this build and therefore the
# dispatch-tree root (primary). No harness router is needed — the cpu master
# feeds uBridge directly and the IP's own nested router decodes. The single
# authored upstream feed is the cpu -> uBridge connection; the ipBridge boundary
# map into bridgeApbDecode is synthesized intrinsically by the IP.
include:
    - ipBridge.yaml
    # ip variant definitions, needed directly here because this file's
    # parameters: section declares ip variant1 (block-type resolution requires
    # the defining file on this include chain). Real-tree path matches
    # ipBridge.yaml so the two dedupe to one context.
    - ../../../ip/ip/yaml/ipVariants.yaml
    # cpu is the generic APB master owned by the 'common' sub-project. Reached via
    # the same real-tree convention the bridge uses for shared_types (see
    # ipBridge.yaml), so in composition its context path is lexically identical to
    # the root ip_top include and the two collapse to one owned context. Ownership
    # is set by child-project detection (CONTEXTOWNINGPROJECT), not this include.
    - ../../../common/cpu/yaml/cpu.yaml

blocks:
    bridgeStdTop:
        desc: "Standalone harness DUT: contains the ipBridge, its APB master, and the stimulus producer"
        hasVl: false
        hasMdl: true
        hasTb: true
        # Model-only testbench DUT: it directly contains the model-only cpu
        # master (mirroring ip_top's cpu), so it cannot sit in an RTL
        # hierarchy. The RTL DUT (uBridge / ipBridge) generates its own RTL
        # independently of this harness top.
        hasRtl: false
    # Testbench container wrapping the bridgeStdTop DUT (mirrors ip_top_tb). The
    # DUT is self-contained (stimulus and master live inside it), so this
    # container adds no surrounding blocks and the generated External is empty.
    bridgeStdTop_tb:
        desc: "Testbench container for bridgeStdTop"
        hasVl: false
        hasMdl: false
        hasTb: false
        hasRtl: false
    # Stimulus producer owned by the bridge's own standalone harness (top-down):
    # it pushes a known marker/data pair on each of the two non-parameterized
    # bridge interfaces (data8If / data70If, in scope via the ipBridge.yaml
    # include). This block used to live inside the reusable ipBridge.yaml; it was
    # relocated here so the reusable IP carries no testbench stimulus. Model-only:
    # bridgeStdTop is a model-only harness, so the stimulus needs no RTL/Verilator.
    bridgeDriver:
        desc: "Stimulus producer: emits the two non-parameterized bridge interfaces"
        hasVl: false
        hasMdl: true
        hasTb: false
        hasRtl: false
        ports:
            out8:  { interface: data8If,  direction: src }
            out70: { interface: data70If, direction: src }

instances:
    bridgeStdTop_tb:   { container: bridgeStdTop_tb, instanceType: bridgeStdTop_tb, instGroup: top }
    u_bridgeStdTop:    { container: bridgeStdTop_tb, instanceType: bridgeStdTop,    instGroup: top }
    uCpu:              { container: bridgeStdTop, instanceType: cpu,             instGroup: top }
    uBridgeDriver:     { container: bridgeStdTop, instanceType: bridgeDriver,    instGroup: top }
    uBridge:           { container: bridgeStdTop, instanceType: ipBridge,        instGroup: top }

connections:
    - { interface: data8If,  src: uBridgeDriver, srcport: out8,   dst: uBridge, dstport: data8In }
    - { interface: data70If, src: uBridgeDriver, srcport: out70,  dst: uBridge, dstport: data70In }
    # APB master -> ipBridge boundary (the single authored upstream feed). The
    # IP's own nested bridgeApbDecode router decodes from this boundary.
    - { interface: apbReg,   src: uCpu, srcport: cpu_main, dst: uBridge }

# variant1 of the foreign 'ip' block is declared here at the standalone
# assembler top (the ip sub-project declares only variant0). Serves the nested
# uBridgeIp1 instance. Values mirror the composed ip_top declaration. In
# composition ip_top owns this declaration and bridgeStdTop is not included, so
# there is no duplicate.
parameters:
    ip:
        - { variant: variant1, param: IP_DATA_WIDTH, value: 70 }
        - { variant: variant1, param: IP_MEM_DEPTH, value: 8 }
        - { variant: variant1, param: IP_NONCONST_DEPTH, value: 12 }

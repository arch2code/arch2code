# Design-only project file for the ipBridge IP.
#
# The entry a PARENT project (ip_top) references to compose ipBridge. It exposes
# only ipBridge's design (ipBridge.yaml), not the standalone test harness
# (bridgeStdTop.yaml's bridgeStdTop / bridgeStdMaster), so the parent's own
# register-bus router stays the sole primary router.
#
# Same projectName / dirs / fileGeneration as ipBridgeProject.yaml.

yamlFormat: 2
projectName: ipBridge

projectFiles:
    - bridge/ipBridge.yaml

topInstance: bridgeStdTop

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_
    blocks:
        varType: blockID
        enumPrefix: BLOCK_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs:
    root: ../..
    base: $root/base
    model: $root/model
    rtl: $root/rtl
    vl_wrap: $root/verif/vl_wrap
    tb: $root/tb
    fwInc: $root/fw/include

fileGeneration:
    template: $a2c/templates/fileGen/fileGen.py
    fileMap:
        includeFW: { name: "IncludesFW", ext: {hdr: "h", src: "cpp"}, cond: {smartInclude: true}, mode: context, basePath: fwInc, desc: "yaml based fw include file" }
    fileCopyrightStatement: "copyright the arch2code project contributors, see https://github.com/arch2code/arch2code/blob/main/LICENSE"
    regBlockNaming: {
            instancePrefix: "u",
            blockSuffix: "Regs",
            camelCase: true,
        }

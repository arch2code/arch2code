# ip_test - top-level integration for the parameterizable IP fixture
#
# The 'ip' block (defined in ip.yaml) is instantiated twice with different
# parameter values:
#   uIp0  variant0  IP_DATA_WIDTH=8   IP_MEM_DEPTH=16
#   uIp1  variant1  IP_DATA_WIDTH=70  IP_MEM_DEPTH=8
#
# The 'src' block provides stimulus to both IP instances. The 'cpu' block
# accesses IP registers via APB through 'apbDecode'.

include:
    - ../common/shared_types.yaml
    - ../src/src.yaml
    # ip and ipBridge blocks are owned by their referenced child projects (see
    # project.yaml projectFiles). Their defining files stay on this context's
    # include chain for block-type resolution; ownership is set by child-project
    # detection (CONTEXTOWNINGPROJECT), not by these includes.
    - ../../../ip/arch/yaml/ip/ipVariants.yaml
    - ../../../bridge/arch/yaml/bridge/ipBridge.yaml

# Container-owned non-parameterized boundary declarations.
# uSrc (parameterized producer) and uIp0/uIp1 (parameterized consumers)
# both remain parameterized; their module-local payload typedefs cannot be
# named at container scope. The container therefore declares concrete,
# non-parameterized interfaces/structs whose field order and bit widths
# match each connected variant's expectation (variant0/variantSrc0 -> 8-bit,
# variant1/variantSrc0 -> 70-bit; marker 1 bit). The cross-interface binds on
# both the producer and consumer ends adapt to these channel types via the
# push_ack thunker in the C++ model; SV binds the generic ports to the
# non-parameterized channel directly.
types:
    boundaryMarkerT:  { width: 1,  desc: "Boundary marker bit; matches srcOut*St::marker and ipDataSt::marker" }
    srcOut0BoundaryT: { width: 8,  desc: "Non-param 8-bit boundary payload; matches uSrc OUT0_DATA_WIDTH=8 / uIp0 IP_DATA_WIDTH=8" }
    srcOut1BoundaryT: { width: 70, desc: "Non-param 70-bit boundary payload; matches uSrc OUT1_DATA_WIDTH=70 / uIp1 IP_DATA_WIDTH=70" }

structures:
    srcOut0BoundarySt:
        marker: { varType: boundaryMarkerT,  desc: "Marker bit; matches srcOut0St::marker / ipDataSt::marker" }
        data:   { varType: srcOut0BoundaryT, desc: "8-bit payload; matches srcOut0St::data@variantSrc0 and ipDataSt::data@variant0" }
    srcOut1BoundarySt:
        marker: { varType: boundaryMarkerT,  desc: "Marker bit; matches srcOut1St::marker / ipDataSt::marker" }
        data:   { varType: srcOut1BoundaryT, desc: "70-bit payload; matches srcOut1St::data@variantSrc0 and ipDataSt::data@variant1" }

interfaces:
    srcOut0BoundaryIf:
        desc: "Non-parameterized container boundary interface for uSrc.out0 -> uIp0.ipDataIf"
        interfaceType: push_ack
        structures:
            - { structure: srcOut0BoundarySt, structureType: data_t }
    srcOut1BoundaryIf:
        desc: "Non-parameterized container boundary interface for uSrc.out1 -> uIp1.ipDataIf"
        interfaceType: push_ack
        structures:
            - { structure: srcOut1BoundarySt, structureType: data_t }

blocks:
    ip_top:
        desc: "Top container holding the two IP instances and the APB decoder"
        hasVl: true
        hasMdl: true
        hasTb: true
        hasRtl: true
    ip_top_tb:
        desc: "Testbench container for ip_top"
        hasVl: false
        hasMdl: false
        hasTb: false
        hasRtl: false
    cpu:
        desc: "APB master / CPU"
        hasVl: false
        hasMdl: true
        hasTb: false
        hasRtl: false
    apbDecode:
        desc: "APB address decoder"
        hasVl: true
        hasMdl: true
        hasTb: false
        hasRtl: true
        addressBlock:
            addressGroup: top
            addressIncrement: 0x01000000
            maxAddressSpaces: 16
            varType: addr_id_top
            enumPrefix: ADDR_ID_TOP_
            upstreamPort: apbReg
            registerDecoderPort: apbReg

instances:
    ip_top_tb:     { container: ip_top_tb, instanceType: ip_top_tb,   instGroup: top }
    u_ip_top:      { container: ip_top_tb, instanceType: ip_top,      instGroup: top }
    uCPU:          { container: ip_top_tb, instanceType: cpu,         instGroup: top }
    uAPBDecode:    { container: ip_top,    instanceType: apbDecode,   instGroup: top }
    uSrc:          { container: ip_top,    instanceType: src,         instGroup: top, variant: variantSrc0 }
    uIp0:          { container: ip_top,    instanceType: ip,          instGroup: top, addressGroup: top, variant: variant0 }
    uIp1:          { container: ip_top,    instanceType: ip,          instGroup: top, addressGroup: top, variant: variant1 }
    uBridgeDriver: { container: ip_top,    instanceType: bridgeDriver,    instGroup: top }
    uBridge:       { container: ip_top,    instanceType: ipBridge,        instGroup: top, addressGroup: top }

connections:
    - { interface: apbReg, src: uCPU, dst: u_ip_top, name: cpu_main }
    - { interface: srcOut0BoundaryIf, src: uSrc, srcport: out0, dst: uIp0, dstport: ipDataIf }
    - { interface: srcOut1BoundaryIf, src: uSrc, srcport: out1, dst: uIp1, dstport: ipDataIf }
    # Stage 8.2 sibling-level connections (non-cross-interface): the
    # Q10 cross-interface bridge sits one level deeper, inside uBridge.
    - { interface: data8If,  src: uBridgeDriver, srcport: out8,  dst: uBridge, dstport: data8In }
    - { interface: data70If, src: uBridgeDriver, srcport: out70, dst: uBridge, dstport: data70In }

connectionMaps:
    - { interface: apbReg, block: ip_top, direction: dst, instance: uAPBDecode, name: cpu_main }

parameters:
    src:
        - { variant: variantSrc0, param: OUT0_DATA_WIDTH, value: 8 }
        - { variant: variantSrc0, param: OUT1_DATA_WIDTH, value: 70 }
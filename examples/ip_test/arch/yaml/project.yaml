# Example project file that defines project level information

yamlFormat: 2
projectName: ip_test

# project files can be regular input files, regular input files with additional projectFiles sections, or additional ProjectFiles.
# note in the case of additional project files any top level controls (such as schema:) are ignored
# relative path names are resolved based on location of project file (this includes sub projects)
projectFiles:
    # Shared 'common' definitions sub-project, contained in this super-repo at
    # examples/ip_test/common (alongside the ip sub-project). Referenced directly
    # here (no symlink for the root), mirroring the ip reference below. ip_top
    # includes shared_types downward; the projectOverrides entry below selects
    # the canonical provider so the reference is owned by projectName common and
    # its package/include/fw artifacts are generated in the common project's tree.
    - ../../common/arch/yaml/commonProject.yaml
    # Referenced child IP projects: the real reusable projects (ip, ipBridge),
    # not design-only shims. Their design closures are resolvable in this parent
    # (cross-project block resolution) and owned by projectName ip / ipBridge
    # (authoritative child-closure ownership); the parent generates only its own
    # objects, the ownership gate skips ip-/ipBridge-owned files (Q-C10).
    - ../../ip/arch/yaml/ipProject.yaml
    - ../../bridge/arch/yaml/ipBridgeProject.yaml
    - top/ip_top.yaml

# Hierarchical provider selection: both the root and the symlinked bridge/ip
# path declare projectName: ip. This root (the highest ancestor) selects the
# root ip provider, so every reference to projectName ip in this composition
# resolves to it. Removing this entry exposes the duplicate-provider error
# naming both the root and the symlinked bridge/ip provider paths.
projectOverrides:
    ip: ../../ip/arch/yaml/ipProject.yaml
    # This root references the real common sub-project directly
    # (examples/ip_test/common), while the bridge's vendored copy
    # (examples/ip_test/bridge/common -> ../common) is a symlink onto the same
    # dir; both declare projectName: common. This root (highest ancestor) selects
    # the canonical provider, so every reference to projectName common in this
    # composition resolves to it and the bridge's symlinked provider path is
    # deduped onto it (real-path identity) so shared_types is one owned context,
    # not a duplicate.
    common: ../../common/arch/yaml/commonProject.yaml

topInstance: ip_top_tb

instanceGroups:
    top:
        varType: inst_top
        enumPrefix: INST_TOP_
    blocks:
        varType: blockID
        enumPrefix: BLOCK_TOP_

addressObjects:
    memories:
        alignment: memsize
        sizeRoundUpPowerOf2: true
        sortDescending: true
    registers:
        alignment: 8
        sortDescending: true

dirs: # this is list of locations that can be referenced as base path in fileMap section
    root: ../.. # project root directory relative to project file - required
    base: $root/base
    model: $root/model
    rtl: $root/rtl
    vl_wrap: $root/verif/vl_wrap
    tb: $root/tb
    fwInc: $root/fw/include

# information about project directory structure to enable simplified maintenance
# and generation of file for new blocks. Note that directory structure will mirror
# architecture hierarchy.
fileGeneration:
    template: $a2c/templates/fileGen/fileGen.py
    # fileMap entries here merge (key-level dict_shallow) over the base
    # config/project.yaml fileMap, so only the additional includeFW entry is
    # declared; the base block/include/config/registrar entries are inherited.
    # includeFW generates one *IncludesFW.{h,cpp} per yaml context (smartInclude),
    # producing the firmware constant/type/struct headers consumed by the fw/ TUs.
    fileMap:
        includeFW: { name: "IncludesFW", ext: {hdr: "h", src: "cpp"}, cond: {smartInclude: true}, mode: context, basePath: fwInc, desc: "yaml based fw include file" }

    # standard copyright statement to be added to all generated files - change to suite your company
    fileCopyrightStatement: "copyright the arch2code project contributors, see https://github.com/arch2code/arch2code/blob/main/LICENSE"
    regBlockNaming: {
            instancePrefix: "u",
            blockSuffix: "Regs",
            camelCase: true,
        } # naming convention for register handler blocks - instancePrefix is prefix for instance names, blockSuffix is suffix for block names

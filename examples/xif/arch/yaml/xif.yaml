# BUG 7 trigger fixture: cross-interface boundary thunker at the testbench/DUT
# boundary. Model-only.
#
# Topology:  uSrc --> uDut --> uSink   (both connections on dutStreamIf, the
#            parameterized interface A; the DUT's own port interface)
#
#   * uDut is parameterized on the SUBSET [DATA_WIDTH]; its ports are on the
#     parameterized dutStreamIf (payload streamSt<Config>). The connections are
#     carried on this same interface A, so the tb External's inherited
#     dutInverted boundary port (streamSt<Config>) is the thunker's up side.
#   * uSrc / uSink are parameterized on the SUPERSET [DATA_WIDTH, FRAME_HEIGHT,
#     FRAME_WIDTH] (FRAME_* are scalar per-variant Config constants the subset
#     DUT drops). Their ports are declared on the NON-parameterized boundary
#     interface streamBndryIf (B), payload the plain streamBndrySt whose packed
#     layout matches streamSt<dutV0>.
#
# Each edge port's declared interface (B) differs in NAME from the connection
# interface (A), so the surviving (uSrc / uSink) end of each pruned connection
# is a cross-interface bind. The DUT is the --excludeInst of its own model
# testbench, so both connections land in prunedConnections. Without the BUG 7
# fix the surviving ends bind push_ack_*<streamBndrySt> to the inherited
# push_ack_*_if<streamSt<Config>> boundary ports unadapted, failing to compile.
# With the fix a per-end boundary thunker bridges streamBndrySt <->
# streamSt<dutV0Config>.
#
# SECOND, UNRELATED TRIGGER, added later: the container-Config gate for the
# testbench External. `xif_tb` declares params:, and `tbPeer` is instantiated
# twice inside it - once at a stated variant and once at a variant that sources
# every parameter FROM the container. The second form emits a Config TEMPLATE and
# a maker template, both applied to the container's own class template parameter.
# Every other consumer of that spelling renders inside the container's class
# template; the External does not, so the symbol has to be bound to the
# container's own resolved Config. The gate is here, rather than in an
# xprojParam cell, because a testbench container's own Config struct is only
# emitted when its config context is owned by the same project - which is true of
# this single-project example and false of every cross-project one.

ipParameters:
    constants:
        DATA_WIDTH:   { value: 16, maxValue: 32, desc: "Stream payload width (DUT + edge blocks)" }
        FRAME_HEIGHT: { value: 8,  maxValue: 16, desc: "Edge-only scalar param the subset DUT drops" }
        FRAME_WIDTH:  { value: 8,  maxValue: 16, desc: "Edge-only scalar param the subset DUT drops" }

types:
    streamDataT:      { width: DATA_WIDTH, maxBitwidth: 32, desc: "Parameterized stream payload word" }
    streamBndryDataT: { width: 16,         desc: "Non-parameterized boundary payload word (matches DATA_WIDTH=16)" }

structures:
    streamSt:
        data: { varType: streamDataT, desc: "Parameterized stream payload" }
    streamBndrySt:
        data: { varType: streamBndryDataT, desc: "Boundary payload; packed layout matches streamSt<dutV0>" }

interfaces:
    dutStreamIf:
        desc: "Parameterized DUT stream (also the connection interface A)"
        interfaceType: push_ack
        structures:
            - { structure: streamSt, structureType: data_t }
    streamBndryIf:
        desc: "Non-parameterized boundary interface B (differing name) declared on the edge ports"
        interfaceType: push_ack
        structures:
            - { structure: streamBndrySt, structureType: data_t }

blocks:
    xif_tb:
        desc: "Testbench container (root). Holds uSrc, uDut, uSink and the two Config-mechanism peers."
        # The testbench container is parameterized so a peer instance can source
        # its parameters FROM it. Everything in this project shares one config
        # context owned by this project, so the container's own per-variant
        # Config struct lands in this context's Config header - the header the
        # generated External already includes.
        params: [DATA_WIDTH, FRAME_HEIGHT, FRAME_WIDTH]
        hasVl: false
        hasRtl: false
        hasMdl: false
        hasTb: false
    dut:
        desc: "Subset-parameterized DUT: forwards streamIn to streamOut"
        params: [DATA_WIDTH]
        hasVl: false
        hasRtl: false
        hasMdl: true
        hasTb: true
        ports:
            streamIn:  { interface: dutStreamIf, direction: dst }
            streamOut: { interface: dutStreamIf, direction: src }
    src:
        desc: "Superset-parameterized stimulus source; boundary port on B"
        params: [DATA_WIDTH, FRAME_HEIGHT, FRAME_WIDTH]
        hasVl: false
        hasRtl: false
        hasMdl: true
        hasTb: false
        ports:
            out: { interface: streamBndryIf, direction: src }
    sink:
        desc: "Superset-parameterized stream sink; boundary port on B"
        params: [DATA_WIDTH, FRAME_HEIGHT, FRAME_WIDTH]
        hasVl: false
        hasRtl: false
        hasMdl: true
        hasTb: false
        ports:
            in: { interface: streamBndryIf, direction: dst }

    tbPeer:
        desc: "Peer of the DUT held by the testbench container; drives and checks its own resolved parameters"
        # Peers of the DUT are emitted into the External pseudo-block, which is
        # the one consumer of the per-instance Config machinery that is NOT a
        # class template. uTbPeerB's variant sources every parameter from the
        # container, so its Config is a TEMPLATE over the container's Config and
        # it is constructed through a maker template applied to the same: both
        # spellings name the container's class template parameter, which has no
        # declaration here and must be bound to the container's own Config.
        params: [DATA_WIDTH, FRAME_HEIGHT, FRAME_WIDTH]
        hasVl: false
        hasRtl: false
        hasMdl: true
        hasTb: false
        ports:
            out: { interface: dutStreamIf, direction: src }
            in:  { interface: dutStreamIf, direction: dst }

instances:
    xif_tb: { container: xif_tb, instanceType: xif_tb, instGroup: top }
    # Each peer drives the other, so every port of both binds at elaboration.
    uTbPeerA: { container: xif_tb, instanceType: tbPeer, instGroup: top, variant: pv0 }
    uTbPeerB: { container: xif_tb, instanceType: tbPeer, instGroup: top, variant: pvSourced }
    uSrc:   { container: xif_tb, instanceType: src,  instGroup: top, variant: srcV0 }
    uDut:   { container: xif_tb, instanceType: dut,  instGroup: top, variant: dutV0 }
    uSink:  { container: xif_tb, instanceType: sink, instGroup: top, variant: sinkV0 }

connections:
    - { interface: dutStreamIf, src: uTbPeerA, srcport: out, dst: uTbPeerB, dstport: in, name: p2q }
    - { interface: dutStreamIf, src: uTbPeerB, srcport: out, dst: uTbPeerA, dstport: in, name: q2p }
    - { interface: dutStreamIf, src: uSrc, srcport: out,       dst: uDut,  dstport: streamIn, name: s2d }
    - { interface: dutStreamIf, src: uDut, srcport: streamOut, dst: uSink, dstport: in,       name: d2s }

parameters:
    dut:
        dutV0:
            DATA_WIDTH: 16
    src:
        srcV0:
            DATA_WIDTH: 16
            FRAME_HEIGHT: 8
            FRAME_WIDTH: 8
    sink:
        sinkV0:
            DATA_WIDTH: 16
            FRAME_HEIGHT: 8
            FRAME_WIDTH: 8
    # The testbench container's own binding. FRAME_HEIGHT is deliberately NOT the
    # declared default, so a container-sourced parameter that silently fell back
    # to the block default would carry 8 where the peers assert 12.
    xif_tb:
        tbV0:
            DATA_WIDTH: 16
            FRAME_HEIGHT: 12
            FRAME_WIDTH: 12
    # pv0 states its values; pvSourced takes every one of them from the
    # testbench container that holds the instance. Both resolve to the same
    # numbers, and each peer stamps its own FRAME_HEIGHT into the payload and
    # asserts the one it receives, so a broken container-sourced link fails the
    # run rather than merely changing a type name.
    tbPeer:
        pv0:
            DATA_WIDTH: 16
            FRAME_HEIGHT: 12
            FRAME_WIDTH: 12
        pvSourced:
            DATA_WIDTH:   { containerParam: DATA_WIDTH }
            FRAME_HEIGHT: { containerParam: FRAME_HEIGHT }
            FRAME_WIDTH:  { containerParam: FRAME_WIDTH }

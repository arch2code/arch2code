include:
  - axiStd.yaml

constants:
  AXI_ADDRESS_WIDTH: {value: 32, desc: "The width of the AXI address busses"}
  AXI_DATA_WIDTH: {value: 32, desc: "The width of the AXI data busses"}
  AXI_STROBE_WIDTH: {value: 4, desc: "The width of the AXI strobe signals"}

types:
  axiAddrT:
    width: AXI_ADDRESS_WIDTH
    desc: "Address Width"
  axiDataT:
    width: AXI_DATA_WIDTH
    desc: "Width of the data bus."
  axiStrobeT:
    width: AXI_STROBE_WIDTH
    desc: "Width of the strobe bus."

structures:
  axiAddrSt:
    addr: {varType: axiAddrT}
  axiDataSt:
    data: {varType: axiDataT}
  axiStrobeSt:
    strobe: {varType: axiStrobeT}

interfaces:
  axiRdIf:
    desc: "AXI Read channels; Address and Data"
    interfaceType: axi_read
    multiCycleMode: api_list_size
    maxTransferSize: 256
    structures:
      - {structure: axiAddrSt, structureType: addr_t}
      - {structure: axiDataSt, structureType: data_t}
  axiWrIf:
    desc: "AXI Write channels; Address, Data, and Response"
    interfaceType: axi_write
    multiCycleMode: api_list_size
    maxTransferSize: 256
    structures:
      - {structure: axiAddrSt, structureType: addr_t}
      - {structure: axiDataSt, structureType: data_t}
      - {structure: axiStrobeSt, structureType: strb_t}

blocks:
  axiSocketMaster_tb:
    desc: "Testbench top (Python AXI master + SystemC memory slave over sockets)"
    hasVl: false
    hasRtl: false
    hasMdl: true
    hasTb: false
  consumer:
    desc: "AXI memory slave responding to read and write bursts"
    hasVl: false
    hasRtl: false
    hasMdl: true
    hasTb: false
  axiSocket:
    desc: "Socket shell facing Python AXI master"
    hasVl: false
    hasRtl: false
    hasMdl: true
    hasTb: true
    hasSkt: true

# Two shells, each with its own consumer. Python drives a different pattern
# through each shell, so a crossed or shared socket connection fails the test.
instances:
  axiSocketMaster_tb: {container: axiSocketMaster_tb, instanceType: axiSocketMaster_tb, instGroup: top}
  u_axiSocket0:       {container: axiSocketMaster_tb, instanceType: axiSocket, instGroup: top}
  u_consumer0:        {container: axiSocketMaster_tb, instanceType: consumer, instGroup: top}
  u_axiSocket1:       {container: axiSocketMaster_tb, instanceType: axiSocket, instGroup: top}
  u_consumer1:        {container: axiSocketMaster_tb, instanceType: consumer, instGroup: top}

connections:
  - {interface: axiRdIf, src: u_axiSocket0, srcport: axiRd0, dst: u_consumer0, dstport: axiRd0, name: axiRd0_0}
  - {interface: axiWrIf, src: u_axiSocket0, srcport: axiWr0, dst: u_consumer0, dstport: axiWr0, name: axiWr0_0}
  - {interface: axiRdIf, src: u_axiSocket1, srcport: axiRd0, dst: u_consumer1, dstport: axiRd0, name: axiRd0_1}
  - {interface: axiWrIf, src: u_axiSocket1, srcport: axiWr0, dst: u_consumer1, dstport: axiWr0, name: axiWr0_1}

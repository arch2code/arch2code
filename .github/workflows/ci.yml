name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # A normal run takes about an hour. The limit stops a hung run well before
  # GitHub's 6-hour default.
  lint-build:
    #runs-on: [self-hosted, linux, x64]
    runs-on: [ubuntu-22.04]
    timeout-minutes: 120
    container:
      image: arch2code/a2c-dev:2.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Python dependencies
        run: pip3 install -r ./requirements.txt

      - name: Run Make Pipeline Tests
        run: |
          git config --global --add safe.directory /__w/arch2code/arch2code 
          make pipeline-test PIPELINE_RUN_TIMEOUT=30m

      - name: Check for unclean repo
        run: |
          if [ -z "$(git status --porcelain)" ]; then 
            echo "Repo clean."
          else 
            echo "Repo not clean after build"
            git status
            git diff
            exit 1
          fi

  # The unit suite regenerates the examples in place (test_build_manifest), so it
  # gets the same clean-repo check as the pipeline job.
  unit-test:
    runs-on: [ubuntu-22.04]
    timeout-minutes: 120
    container:
      image: arch2code/a2c-dev:2.0
    steps:
      # Full history: test_file_prefix extracts main's examples from a pinned commit.
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: pip3 install -r ./requirements.txt

      - name: Run unit tests
        run: |
          git config --global --add safe.directory /__w/arch2code/arch2code
          make unittest

      - name: Check for unclean repo
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Repo clean."
          else
            echo "Repo not clean after build"
            git status
            git diff
            exit 1
          fi
